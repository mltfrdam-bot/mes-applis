plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// Numéro de version donné par la fabrication (GitHub)
def numVersion = (project.findProperty("numVersion") ?: "1") as int

android {
    namespace "fr.mesapplis.lecteur"
    compileSdk 34
    defaultConfig {
        applicationId "fr.mesapplis.lecteur"
        minSdk 26
        targetSdk 34
        versionCode numVersion
        versionName "1." + numVersion
        resValue "string", "app_name", "Lecteur"
        // Téléphones 64 bits seulement (tous les téléphones récents) : le traducteur contient un gros code natif
        ndk { abiFilters "arm64-v8a" }
    }
    signingConfigs {
        release {
            storeFile file(System.getenv("CLE_FICHIER") ?: "../../../signature/mes-applis.keystore")
            storePassword System.getenv("CLE_MOT_DE_PASSE")
            keyAlias "mesapplis"
            keyPassword System.getenv("CLE_MOT_DE_PASSE")
            storeType "pkcs12"
        }
    }
    buildTypes {
        // APK le plus léger possible : le code inutilisé est retiré
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
    }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "androidx.media3:media3-exoplayer:1.4.1"
    implementation "androidx.media3:media3-session:1.4.1"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.palette:palette:1.0.0"
    implementation "androidx.core:core:1.13.1"
    // 🌐 Traduction sur le téléphone : pack de langue téléchargé une seule fois
    implementation "com.google.mlkit:translate:17.0.3"
    implementation "com.google.mlkit:language-id:17.0.6"
}

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Footing</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #f6f7f9; }
  body { margin: 0; font: 17px/1.35 system-ui, Roboto, sans-serif; color: #1b1f23; user-select: none; }
  main { max-width: 520px; margin: 0 auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 18px; margin: 2px 0; color: #B5451B; display: flex; justify-content: space-between; align-items: center; }
  h1 span { font-size: 14px; color: #5b6470; font-weight: 400; }
  button { font: inherit; border: none; border-radius: 12px; cursor: pointer; }
  .niv { min-height: 66px; font-size: 22px; font-weight: 700; color: #fff; }
  .n1 { background: #2e8b57; } .n2 { background: #6aa84f; } .n3 { background: #3b7bbf; } .n4 { background: #e69138; } .n5 { background: #c0392b; }
  .niv:active { transform: scale(.98); filter: brightness(1.15); }
  .ligne { display: flex; gap: 8px; }
  .sec { background: #fff; border: 1px solid #d9dce1; padding: 12px; font-weight: 600; flex: 1; }
  .main { background: #B5451B; color: #fff; padding: 14px; font-weight: 700; flex: 1; }
  .dernier { text-align: center; color: #1b1f23; font-weight: 600; min-height: 24px; }
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 15px; }
  td, th { border: 1px solid #d9dce1; padding: 5px 7px; text-align: left; }
  th { background: #eef0f3; font-size: 13px; }
  td.x { width: 1%; text-align: center; }
  .aide { font-size: 13px; color: #5b6470; margin: 0; }
  .vide { color: #5b6470; text-align: center; padding: 10px; }
</style>
</head>
<body>
<main>
  <h1>🏃 Footing — ressentis <span id="jour"></span></h1>
  <p class="aide">Pas besoin de laisser l'appli ouverte : sors le téléphone, touche ton ressenti, range-le. L'heure est notée et je la cale sur ta montre COROS.</p>
  <button class="niv n1" data-n="1">😌 Très facile</button>
  <button class="niv n2" data-n="2">🙂 Facile</button>
  <button class="niv n3" data-n="3">😐 Normal</button>
  <button class="niv n4" data-n="4">😤 J'accélère</button>
  <button class="niv n5" data-n="5">🥵 À fond</button>
  <div class="dernier" id="dernier"></div>
  <div class="ligne"><button class="sec" id="note">📝 Note</button><button class="sec" id="km">📍 Je passe un km</button></div>
  <table id="tab"></table>
  <div class="ligne"><button class="main" id="envoyer">📤 Envoyer à Claude</button><button class="sec" id="copier" style="flex:0 0 auto">Copier</button></div>
  <div class="ligne"><button class="sec" id="nouvelle">Nouvelle course</button></div>
</main>
<script>
const $ = (s) => document.querySelector(s);
const NOMS = { 1: "Très facile", 2: "Facile", 3: "Normal", 4: "J'accélère", 5: "À fond" };
const CLE = "footing-courses";
const hh = (d) => new Date(d).toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
function lire() { try { return JSON.parse(localStorage.getItem(CLE) || "[]"); } catch (e) { return []; } }
function ecrire(c) { try { localStorage.setItem(CLE, JSON.stringify(c)); } catch (e) {} }
/* Une course = tout ce qui est noté sans pause de plus de 2 h. Rien à démarrer. */
function courseActuelle(creer) { const c = lire(), d = c[c.length - 1]; const der = d && d.notes.length ? d.notes[d.notes.length - 1].t : d && d.debut;
  if (d && !d.close && Date.now() - der < 2 * 3600e3) return { c, d };
  if (!creer) return { c, d: null }; const n = { id: Date.now(), debut: Date.now(), notes: [] }; c.push(n); return { c, d: n }; }
function ajouter(entree) { const { c, d } = courseActuelle(true); d.notes.push(Object.assign({ t: Date.now() }, entree)); ecrire(c); try { navigator.vibrate(80); } catch (e) {} afficher(); }
function libelle(x) { return x.n ? NOMS[x.n] : x.km ? "📍 Km " + x.km : "📝 " + x.note; }
function afficher() { const { d } = courseActuelle(false); $("#jour").textContent = new Date().toLocaleDateString("fr-FR", { weekday: "short", day: "2-digit", month: "2-digit" });
  if (!d || !d.notes.length) { $("#tab").innerHTML = '<tr><td class="vide">Rien de noté pour cette course.</td></tr>'; $("#dernier").textContent = ""; return; }
  const l = d.notes[d.notes.length - 1]; $("#dernier").textContent = "Noté à " + hh(l.t) + " : " + libelle(l);
  $("#tab").innerHTML = "<tr><th>Heure</th><th>Ressenti / note</th><th></th></tr>" + d.notes.map((x, i) => `<tr><td>${hh(x.t)}</td><td>${libelle(x).replace(/</g, "&lt;")}</td><td class="x"><button class="sec" data-i="${i}" style="padding:4px 8px">✕</button></td></tr>`).join("");
  $("#tab").querySelectorAll("button[data-i]").forEach(b => b.onclick = () => { if (!confirm("Effacer cette ligne ?")) return; const r = courseActuelle(false); r.d.notes.splice(Number(b.dataset.i), 1); ecrire(r.c); afficher(); }); }
document.querySelectorAll(".niv").forEach(b => b.onclick = () => ajouter({ n: Number(b.dataset.n) }));
$("#note").onclick = () => { const t = prompt("Ta note :"); if (t && t.trim()) ajouter({ note: t.trim() }); };
$("#km").onclick = () => { const { d } = courseActuelle(false); const n = (d ? d.notes.filter(x => x.km).length : 0) + 1; ajouter({ km: n }); };
function texte() { const { d } = courseActuelle(false); const c = lire(), x = d || c[c.length - 1]; if (!x || !x.notes.length) return "";
  return ["FOOTING — RESSENTIS — " + new Date(x.notes[0].t).toLocaleDateString("fr-FR"), ...x.notes.map(n => hh(n.t) + " " + (n.n ? n.n + " " + NOMS[n.n] : libelle(n)))].join("\n"); }
$("#copier").onclick = () => { const t = texte(); if (!t) return; navigator.clipboard.writeText(t).then(() => { $("#copier").textContent = "Copié ✓"; setTimeout(() => $("#copier").textContent = "Copier", 2000); }); };
$("#envoyer").onclick = async () => { const t = texte(); if (!t) return; try { await navigator.share({ text: t }); } catch (e) { try { await navigator.clipboard.writeText(t); } catch (x) {} $("#envoyer").textContent = "Copié : colle-le à Claude"; } };
$("#nouvelle").onclick = () => { const r = courseActuelle(false); if (r.d) { r.d.close = true; ecrire(r.c); } afficher(); };
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") afficher(); });
afficher();
</script>
</body>
</html>

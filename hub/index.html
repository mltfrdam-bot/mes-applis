<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1d5fbf">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icone-192.png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f4f5f7;color:#1d2330;font-size:17px}
  button{font:inherit;cursor:pointer}
  #entete{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;background:#1d5fbf;color:#fff;padding:10px 12px;min-height:56px}
  #entete h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px}
  .tuile{position:relative;background:#fff;border:1px solid #d3d8e0;border-radius:14px;padding:14px 6px 10px;text-align:center;min-height:112px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
  .tuile:active{background:#e9f0fb}
  .tuile .ico{font-size:40px;line-height:1}
  .tuile .nom{font-size:14px;font-weight:600;word-break:break-word}
  .tuile.ajout{border:2px dashed #1d5fbf;color:#1d5fbf;background:#f7faff}
  .badge{position:absolute;top:6px;right:6px;background:#d9480f;color:#fff;font-size:11px;font-weight:700;border-radius:8px;padding:2px 6px}

  .btn.vert{background:#2b8a3e}

  table{border-collapse:collapse;width:100%;font-size:15px;background:#fff}

  .att{color:#d9480f;font-weight:700}
  input[type=text]{font:inherit;padding:10px;border:1px solid #c9ced6;border-radius:8px;width:100%}
  label{display:block;font-weight:600;margin:10px 0 4px}
  .emojis{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .emojis button{font-size:24px;background:#fff;border:1px solid #d3d8e0;border-radius:8px;padding:4px 7px}
  #bandeau{display:none;background:#fff4e6;border-bottom:1px solid #f0c08a;padding:10px 14px;font-size:15px}
  #vueApp{position:fixed;left:0;right:0;bottom:0;top:56px;background:#fff;display:none}
  #vueApp iframe{border:0;width:100%;height:100%;display:block}

  #fenetre h3{margin:0 0 10px;font-size:19px}
  #fenetre .btn{display:block;width:100%;margin:6px 0}
  #pointage{position:fixed;left:0;right:0;bottom:0;z-index:25;background:#d9480f;color:#fff;padding:12px;font-size:16px;font-weight:600;text-align:center}
  #pointage .btn{margin:6px 4px 0}
  textarea{font:inherit;width:100%;min-height:110px;padding:10px;border:1px solid #c9ced6;border-radius:8px}

  #toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1d2330;color:#fff;padding:11px 16px;border-radius:10px;font-size:15px;display:none;z-index:30;max-width:92%;text-align:center}
  .cache{display:none!important}
</style>

<body>
<header id="entete">
  <button id="btnRetour" class="cache" aria-label="Retour à l'accueil">← Accueil</button>
  <h1 id="titre">Mon Hub</h1>
  <button id="btnSignal" title="Signaler un problème ou une idée">📍</button>
  <span id="outils" style="display:flex;gap:6px"><button id="btnSante" title="Santé des applis">🩺</button><button id="btnGerer" title="Gérer les applis">⚙️</button><button id="btnSauv" title="Sauvegarde">💾</button></span>
</header>
<div id="bandeau"></div>
<div id="bandeauSante" style="display:none;background:#fff4e6;border-bottom:1px solid #f0c08a;padding:10px 14px;font-size:15px"></div>
<main id="contenu"></main>
<div id="vueApp"></div>
<div id="voile"><div id="fenetre"></div></div>
<div id="toast"></div>
<input type="file" id="choixFichier" class="cache">

<script>
'use strict';
/* =====================================================================
   MON HUB — coquille qui range des applis (modules) séparées.
   - Chaque appli est un fichier HTML rangé dans le téléphone (base « mon-hub »).
   - Chaque appli tourne dans son propre cadre, avec son propre espace de données :
     ses clés localStorage et ses bases IndexedDB reçoivent le préfixe « hubapp:<id>: ».
   - Le registre partagé permet aux applis d'échanger des données (ex. regards).
   - Sauvegarde / fusion / restauration communes à toutes les applis.
   ===================================================================== */
const HUB_VERSION = '1.5';
const PREFIXE = 'hubapp:';
const APP_ANDROID = window.AndroidApp || null;

/* ---------- Petits outils ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t, ms){ const e=$('#toast'); e.textContent=t; e.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>e.style.display='none', ms||3200); }
function dateFr(iso){ if(!iso) return '—'; const d=new Date(iso); return d.toLocaleDateString('fr-FR')+' '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
function horodatage(){ const d=new Date(), z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'_'+z(d.getHours())+'h'+z(d.getMinutes()); }
function slug(t){ return String(t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30) || 'appli'; }
function promReq(r){ return new Promise((ok,ko)=>{ r.onsuccess=()=>ok(r.result); r.onerror=()=>ko(r.error); }); }
function egal(a,b){ return JSON.stringify(a)===JSON.stringify(b); }

/* Fenêtre de dialogue (remplace alert/confirm) : renvoie la valeur du bouton choisi. */
function fenetre(titre, html, boutons){
  return new Promise(ok=>{
    const f=$('#fenetre');
    f.innerHTML='<h3>'+esc(titre)+'</h3><div>'+html+'</div><div style="margin-top:14px">'+
      boutons.map((b,i)=>'<button class="btn '+(b.classe||'')+'" data-i="'+i+'">'+esc(b.texte)+'</button>').join('')+'</div>';
    $('#voile').style.display='flex';
    f.querySelectorAll('button[data-i]').forEach(btn=>btn.onclick=()=>{
      const b=boutons[+btn.dataset.i];
      const v=typeof b.valeur==='function'?b.valeur(f):b.valeur;
      $('#voile').style.display='none'; ok(v);
    });
  });
}
const info = (titre, html) => fenetre(titre, html, [{texte:'OK', valeur:true}]);

/* Choisir un fichier sur le téléphone. */
function choisirFichier(accept){
  return new Promise(ok=>{
    const inp=$('#choixFichier'); inp.value=''; inp.accept=accept||'';
    inp.onchange=()=>ok(inp.files[0]||null);
    inp.click();
  });
}
const lireTexte = f => new Promise((ok,ko)=>{ const r=new FileReader(); r.onload=()=>ok(r.result); r.onerror=()=>ko(r.error); r.readAsText(f); });

/* Enregistrer un fichier (Téléchargements, ou pont Android dans l'APK). */
function enregistrerFichier(nom, contenu, type){
  if(APP_ANDROID && APP_ANDROID.enregistrer){
    try{ toast(APP_ANDROID.enregistrer(nom, contenu, type) || ('Fichier « '+nom+' » enregistré')); return; }catch(e){}
  }
  const b=new Blob([contenu],{type:type||'application/octet-stream'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=nom;
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  toast('Fichier « '+nom+' » enregistré dans Téléchargements', 4500);
}

/* ---------- Base du hub (IndexedDB « mon-hub ») ---------- */
let baseHub=null;
function ouvrirBase(){
  if(baseHub) return Promise.resolve(baseHub);
  const r=indexedDB.open('mon-hub',3);
  r.onupgradeneeded=()=>{
    const db=r.result;
    if(!db.objectStoreNames.contains('apps')) db.createObjectStore('apps',{keyPath:'id'});
    if(!db.objectStoreNames.contains('registre')) db.createObjectStore('registre',{keyPath:'cle'});
    if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'cle'});
    if(!db.objectStoreNames.contains('journal')) db.createObjectStore('journal',{keyPath:'id'});   // santé des applis
    if(!db.objectStoreNames.contains('signalements')) db.createObjectStore('signalements',{keyPath:'id'});   // 📍 messages pour Claude
  };
  return promReq(r).then(db=>(baseHub=db));
}
async function tous(store){ const db=await ouvrirBase(); return promReq(db.transaction(store).objectStore(store).getAll()); }
async function un(store,cle){ const db=await ouvrirBase(); return promReq(db.transaction(store).objectStore(store).get(cle)); }
async function poser(store,val){ const db=await ouvrirBase(); const t=db.transaction(store,'readwrite'); t.objectStore(store).put(val); return new Promise((ok,ko)=>{t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);}); }
async function enlever(store,cle){ const db=await ouvrirBase(); const t=db.transaction(store,'readwrite'); t.objectStore(store).delete(cle); return new Promise((ok,ko)=>{t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);}); }
async function vider(store){ const db=await ouvrirBase(); const t=db.transaction(store,'readwrite'); t.objectStore(store).clear(); return new Promise((ok,ko)=>{t.oncomplete=()=>ok();t.onerror=()=>ko(t.error);}); }
async function lireMeta(cle,def){ const m=await un('meta',cle); return m?m.valeur:def; }
const ecrireMeta=(cle,valeur)=>poser('meta',{cle,valeur});
async function listeApps(){ return (await tous('apps')).sort((a,b)=>(a.ordre||0)-(b.ordre||0) || a.nom.localeCompare(b.nom)); }

/* ---------- Registre partagé (accessible aux applis par window.Hub) ---------- */
function HubPourApp(appId){
  return {
    version: HUB_VERSION,
    appId,
    registre: {
      lire: async cle => { const e=await un('registre',cle); return e?e.valeur:undefined; },
      ecrire: (cle,valeur) => poser('registre',{cle, valeur, app:appId, maj:new Date().toISOString()}),
      supprimer: cle => enlever('registre',cle),
      liste: async (prefixe='') => (await tous('registre')).filter(e=>e.cle.startsWith(prefixe)).map(e=>({cle:e.cle, valeur:e.valeur, app:e.app, maj:e.maj}))
    }
  };
}
window.HubPourApp = HubPourApp;

/* ---------- Le « compartiment » de chaque appli ----------
   Ce code est placé AU DÉBUT de chaque appli avant de la lancer.
   Il range ses données sous « hubapp:<id>: » pour qu'aucune appli ne voie celles des autres. */
function compartiment(ID){
  var P='hubapp:'+ID+':';
  function fabriquer(reel){
    function cles(){ var a=[]; for(var i=0;i<reel.length;i++){ var k=reel.key(i); if(k && k.indexOf(P)===0) a.push(k.slice(P.length)); } return a; }
    var api={
      getItem:function(k){ return reel.getItem(P+k); },
      setItem:function(k,v){ reel.setItem(P+k,String(v)); },
      removeItem:function(k){ reel.removeItem(P+k); },
      clear:function(){ cles().forEach(function(k){ reel.removeItem(P+k); }); },
      key:function(i){ var c=cles(); return i<c.length?c[i]:null; }
    };
    return new Proxy(api,{
      get:function(t,p){ if(p==='length') return cles().length; if(typeof p==='symbol' || p in t) return t[p]; var v=reel.getItem(P+p); return v===null?undefined:v; },
      set:function(t,p,v){ if(typeof p==='symbol' || p in t || p==='length') return true; reel.setItem(P+p,String(v)); return true; },
      deleteProperty:function(t,p){ reel.removeItem(P+String(p)); return true; },
      has:function(t,p){ return p in t || p==='length' || reel.getItem(P+String(p))!==null; },
      ownKeys:function(){ return cles(); },
      getOwnPropertyDescriptor:function(t,p){ var v=reel.getItem(P+String(p)); return v===null?undefined:{value:v,writable:true,enumerable:true,configurable:true}; }
    });
  }
  try{ var ls=window.localStorage; Object.defineProperty(window,'localStorage',{value:fabriquer(ls),configurable:true,enumerable:true}); }catch(e){}
  try{ var ss=window.sessionStorage; Object.defineProperty(window,'sessionStorage',{value:fabriquer(ss),configurable:true,enumerable:true}); }catch(e){}
  try{
    var f=window.indexedDB, o=f.open.bind(f), d=f.deleteDatabase.bind(f), l=f.databases?f.databases.bind(f):null;
    f.open=function(n,v){ return v===undefined?o(P+n):o(P+n,v); };
    f.deleteDatabase=function(n){ return d(P+n); };
    if(l) f.databases=function(){ return l().then(function(a){ return a.filter(function(x){ return x.name && x.name.indexOf(P)===0; }).map(function(x){ return {name:x.name.slice(P.length), version:x.version}; }); }); };
  }catch(e){}
  try{ window.Hub = parent.HubPourApp ? parent.HubPourApp(ID) : null; }catch(e){}
  try{ if(parent.AndroidApp && !window.AndroidApp) window.AndroidApp = parent.AndroidApp; }catch(e){}
  /* Santé : on prévient le hub des erreurs et du temps de démarrage de l'appli. */
  var t0=Date.now();
  function signal(type,info){ try{ if(parent.HubSignal) parent.HubSignal(ID,type,info); }catch(e){} }
  window.addEventListener('error',function(e){
    var cible=e.target;
    if(cible && cible!==window && (cible.src||cible.href)) signal('ressource',{message:'Élément non chargé : '+(cible.src||cible.href)});
    else signal('erreur',{message:String(e.message||'Erreur inconnue'),ligne:e.lineno||null,colonne:e.colno||null});
  },true);
  window.addEventListener('unhandledrejection',function(e){ var r=e.reason; signal('erreur',{message:'Promesse rejetée : '+String(r&&r.message?r.message:r)}); });
  window.addEventListener('load',function(){ signal('charge',{ms:Date.now()-t0}); });
}
function preparerCode(html, id){
  const s='<scr'+'ipt>('+compartiment.toString().replace(/\n\s*/g,' ')+')('+JSON.stringify(id)+');</scr'+'ipt>';   // sur une seule ligne : les numéros de ligne des erreurs restent ceux du fichier de l'appli
  const m=html.match(/<head[^>]*>/i);
  if(m) return html.replace(m[0], m[0]+s);
  const h=html.match(/<html[^>]*>/i);
  if(h) return html.replace(h[0], h[0]+'<head>'+s+'</head>');
  return s+html;
}

/* Repère ce qu'une appli va chercher sur internet (ne marchera pas hors ligne). */
function elementsInternet(html){
  const hotes=new Set();
  const motifs=[
    /<script[^>]+src\s*=\s*["'](?:https?:)?\/\/([^\/"'?#]+)/gi,
    /<link[^>]+href\s*=\s*["'](?:https?:)?\/\/([^\/"'?#]+)/gi,
    /<img[^>]+src\s*=\s*["'](?:https?:)?\/\/([^\/"'?#]+)/gi,
    /url\(\s*["']?(?:https?:)?\/\/([^\/"')?#]+)/gi,
    /@import\s+(?:url\()?["']?(?:https?:)?\/\/([^\/"')?#]+)/gi,
    /fetch\(\s*["'`]https?:\/\/([^\/"'`?#]+)/gi
  ];
  motifs.forEach(m=>{ let r; while((r=m.exec(html))) hotes.add(r[1]); });
  return [...hotes];
}
const titreDuCode = html => { const m=html.match(/<title[^>]*>([\s\S]*?)<\/title>/i); return m ? m[1].replace(/\s+/g,' ').trim() : ''; };

/* ---------- Catalogue en ligne (dossier GitHub du hub) ---------- */
async function chargerCatalogue(){
  try{
    const ctrl=new AbortController(); const t=setTimeout(()=>ctrl.abort(),7000);
    const r=await fetch('catalogue.json?t='+Date.now(),{cache:'no-store',signal:ctrl.signal});
    clearTimeout(t);
    if(!r.ok) return null;
    const j=await r.json();
    await ecrireMeta('catalogue', j);
    return j;
  }catch(e){ return null; }
}
let majDispo={};   // id -> version disponible dans le catalogue
async function verifierMisesAJour(){
  const cat=await chargerCatalogue(); if(!cat) return;
  const apps=await listeApps(); majDispo={};
  (cat.applis||[]).forEach(c=>{ const a=apps.find(x=>x.id===c.id && x.source==='catalogue'); if(a && String(a.version)!==String(c.version)) majDispo[a.id]=c.version; });
  if(vueCourante==='accueil') vueAccueil();
}

/* ---------- Navigation ---------- */
let vueCourante='accueil', urlApp=null;
function montrer(vue, rendu, titre){
  vueCourante=vue;
  $('#titre').textContent=titre||'Mon Hub';
  $('#vueApp').style.display='none';
  $('#contenu').style.display='block';
  $('#btnRetour').classList.toggle('cache', vue==='accueil');
  $('#outils').classList.toggle('cache', vue!=='accueil');
  if(vue!=='accueil' && !(history.state && history.state.v)) history.pushState({v:vue},'');
  rendu();
  window.scrollTo(0,0);
}
function retourAccueil(){ fermerApp(); vueAccueil(); }
window.addEventListener('popstate',()=>{ if(vueCourante!=='accueil') retourAccueil(); });
$('#btnRetour').onclick=()=>{ if(history.state && history.state.v) history.back(); else retourAccueil(); };
$('#btnGerer').onclick=()=>vueGerer();
$('#btnSauv').onclick=()=>vueSauvegarde();
$('#btnSante').onclick=()=>vueSante();
$('#btnSignal').onclick=()=>signaler();

/* ---------- Accueil ---------- */
async function vueAccueil(){
  vueCourante='accueil';
  if(history.state && history.state.v) history.replaceState(null,'');
  $('#titre').textContent='Mon Hub';
  $('#btnRetour').classList.add('cache'); $('#outils').classList.remove('cache'); document.title='Mon Hub';
  $('#vueApp').style.display='none'; $('#contenu').style.display='block';
  const apps=await listeApps();
  const derniere=await lireMeta('derniereSauvegarde',null);
  let rappel='';
  if(apps.length){
    const jours = derniere ? Math.floor((Date.now()-new Date(derniere))/864e5) : null;
    if(jours===null) rappel='<div class="carte att">⚠️ Aucune sauvegarde faite pour l\'instant. Appuie sur 💾 en haut.</div>';
    else if(jours>=7) rappel='<div class="carte att">⚠️ Dernière sauvegarde il y a '+jours+' jours. Pense à appuyer sur 💾.</div>';
  }
  const tuiles=apps.map(a=>'<button class="tuile" data-id="'+esc(a.id)+'">'+(majDispo[a.id]?'<span class="badge">MAJ</span>':(etatsApps[a.id]==='probleme'?'<span class="badge">❌</span>':etatsApps[a.id]==='surveiller'?'<span class="badge" style="background:#f08c00">⚠️</span>':''))+
    '<span class="ico">'+esc(a.icone||'📦')+'</span><span class="nom">'+esc(a.nom)+'</span></button>').join('');
  const vide = apps.length ? '' : '<div class="carte aide">👋 Ton hub est prêt.<br>Appuie sur <b>➕ Ajouter</b> pour ranger ta première appli : depuis un fichier HTML (sans internet) ou depuis le catalogue.</div>';
  $('#contenu').innerHTML = rappel + vide + '<div class="grille">'+tuiles+
    '<button class="tuile ajout" id="tuileAjout"><span class="ico">➕</span><span class="nom">Ajouter</span></button></div>'+
    installAide();
  $('#contenu').querySelectorAll('.tuile[data-id]').forEach(b=>b.onclick=()=>ouvrirApp(b.dataset.id));
  $('#tuileAjout').onclick=()=>vueAjouter();
  const bi=$('#btnInstaller'); if(bi) bi.onclick=installer;
}

/* ---------- Ouvrir une appli ---------- */
async function ouvrirApp(id){
  const a=await un('apps',id); if(!a) return;
  fermerApp();
  vueCourante='app';
  if(!(history.state && history.state.v)) history.pushState({v:'app'},'');
  $('#titre').textContent=(a.icone||'')+' '+a.nom;
  $('#btnRetour').classList.remove('cache'); $('#outils').classList.add('cache'); document.title=a.nom;
  $('#contenu').style.display='none';
  const zone=$('#vueApp'); zone.style.display='block';
  urlApp=URL.createObjectURL(new Blob([preparerCode(a.code, a.id)],{type:'text/html'}));
  const fr=document.createElement('iframe');
  fr.setAttribute('allow','camera *; microphone *; accelerometer *; gyroscope *; magnetometer *; geolocation *; fullscreen *; bluetooth *; screen-wake-lock *; clipboard-write *; autoplay *');
  fr.setAttribute('allowfullscreen','');
  fr.src=urlApp;
  zone.innerHTML=''; zone.appendChild(fr);

/* Verdict de viabilité d'une appli sur 30 jours. */
function bilanApp(app, l){
  const s30=l.filter(e=>e.type==='session' && e.app===app.id && Date.now()-new Date(e.date)<30*JOUR);
  const s7=s30.filter(e=>Date.now()-new Date(e.date)<7*JOUR);
  const avecErr=s30.filter(e=>e.erreurs>0).length, err7=s7.reduce((t,e)=>t+e.erreurs,0);
  const charges=s30.map(e=>e.chargeMs).filter(x=>x!=null), chargeMoy=charges.length?Math.round(charges.reduce((a,b)=>a+b,0)/charges.length):null;
  const bloq7=s7.filter(e=>e.bloquee).length;
  const b={ouvertures:s30.length, temps:s30.reduce((t,e)=>t+(e.duree||0),0), erreurs:s30.reduce((t,e)=>t+e.erreurs,0), sessionsErr:avecErr, err7, chargeMoy, bloq7, ressources:s30.reduce((t,e)=>t+(e.ressources||0),0),
    derniers:s30.flatMap(e=>(e.messages||[]).map(m=>Object.assign({version:e.version},m))).sort((x,y)=>y.quand.localeCompare(x.quand)).slice(0,10)};
  if(bloq7 || (s30.length>=3 && avecErr/s30.length>=0.3)) { b.verdict='probleme'; b.texte='❌ Problème'; b.explic=bloq7?'Ne démarre pas toujours ('+bloq7+' fois en 7 jours).':'Erreurs dans '+Math.round(avecErr/s30.length*100)+' % des ouvertures.'; }
  else if(err7 || (chargeMoy!=null && chargeMoy>3000)) { b.verdict='surveiller'; b.texte='⚠️ À surveiller'; b.explic=err7?err7+' erreur(s) cette semaine.':'Démarrage lent ('+(chargeMoy/1000).toFixed(1)+' s).'; }
  else if(!s30.length) { b.verdict='inutilisee'; b.texte='💤 Peu utilisée'; b.explic='Pas ouverte depuis 30 jours.'; }
  else { b.verdict='stable'; b.texte='✅ Stable'; b.explic='Aucune erreur cette semaine.'; }
  return b;
}
const duree = s => s<60 ? s+' s' : s<3600 ? Math.round(s/60)+' min' : (s/3600).toFixed(1).replace('.',',')+' h';

async function controleDemarrage(){

  try{ if(navigator.storage && navigator.storage.persisted && !(await navigator.storage.persisted())) points.push({niv:'att',texte:'Données pas encore protégées contre l\'effacement automatique (💾 → Protéger).'}); }catch(e){}
  if(!APP_ANDROID && location.protocol.startsWith('http') && 'serviceWorker' in navigator && !navigator.serviceWorker.controller) points.push({niv:'info',texte:'Mode hors ligne pas encore prêt : rouvre le hub une fois avec internet.'});

  const der=await lireMeta('derniereSauvegarde',null);

  const l=await journal();

  if(eh) points.push({niv:'att',texte:'Le hub a eu '+eh+' erreur(s) cette semaine.'});
  return points;
}

/* Étape 1 : toucher l'endroit concerné (dans l'appli ouverte, ou dans le hub). */
function pointer(){
  return new Promise(fin=>{
    const fr=$('#vueApp iframe');
    let doc=document, win=window;
    try{ if(fr && fr.contentDocument && $('#vueApp').style.display!=='none'){ doc=fr.contentDocument; win=fr.contentWindow; } }catch(e){}
    const ban=document.createElement('div'); ban.id='pointage';
    ban.innerHTML='📍 Touche l\'endroit concerné<br><small style="font-weight:400">(fais d\'abord défiler jusqu\'à l\'endroit, puis appuie sur 📍)</small><br><button class="btn petit gris" id="pSans">Sans endroit précis</button><button class="btn petit gris" id="pAnn">Annuler</button>';
    document.body.appendChild(ban);
    const st=doc.createElement('style'); st.textContent='.hub-pointe{outline:3px solid #d9480f!important;outline-offset:2px!important}'; (doc.head||doc.documentElement).appendChild(st);
    // Sur écran tactile, bloquer l'appui annule le « click » : on choisit donc l'élément au moment où le doigt se lève.
    let fini=false;
    const horsBandeau=e=>!(e.target && e.target.closest && e.target.closest('#pointage'));
    const bloquer=e=>{ if(!horsBandeau(e)) return; if(e.cancelable) e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation(); };
    const choisir=e=>{
      if(fini || !horsBandeau(e)) return;
      bloquer(e);
      const t=e.changedTouches && e.changedTouches[0];
      const x=t?t.clientX:e.clientX, y=t?t.clientY:e.clientY;
      let el=(x!=null && y!=null)?doc.elementFromPoint(x,y):null;
      if(!el || el===doc.documentElement || el===doc.body) el=e.target;
      if(!el || !el.classList) return;
      fini=true;
      el.classList.add('hub-pointe');
      terminer(decrireElement(el,win,doc===document));
      setTimeout(()=>{ el.classList.remove('hub-pointe'); st.remove(); },60000);
    };
    const evts=['pointerdown','mousedown','touchstart','mouseup','click'];
    const fins=['pointerup','touchend'];
    evts.forEach(t=>doc.addEventListener(t,bloquer,{capture:true,passive:false}));
    fins.forEach(t=>doc.addEventListener(t,choisir,{capture:true,passive:false}));
    function terminer(r){ fini=true; evts.forEach(t=>doc.removeEventListener(t,bloquer,{capture:true})); fins.forEach(t=>doc.removeEventListener(t,choisir,{capture:true}));
      // le « click » qui suit le doigt levé est encore bloqué un court instant
      const stop=e=>{ if(horsBandeau(e) && !(e.target.closest && e.target.closest('#voile'))){ e.preventDefault(); e.stopPropagation(); doc.removeEventListener('click',stop,true); } }; doc.addEventListener('click',stop,true); setTimeout(()=>doc.removeEventListener('click',stop,true),400);
      ban.remove(); if(r===undefined||r===null) st.remove(); fin(r); }
    ban.querySelector('#pSans').onclick=()=>terminer({aucun:true});
    ban.querySelector('#pAnn').onclick=()=>terminer(null);
  });
}
function decrireElement(el, win, dansHub){
  const txt=x=>String(x||'').replace(/\s+/g,' ').trim();
  let chemin=[], n=el;
  for(let i=0;n && n.nodeType===1 && i<5 && n.tagName!=='BODY';i++,n=n.parentElement){
    let p=n.tagName.toLowerCase(); if(n.id){ p+='#'+n.id; chemin.unshift(p); break; }
    const cl=[...n.classList].filter(c=>c!=='hub-pointe').slice(0,2); if(cl.length) p+='.'+cl.join('.');
    if(n.parentElement){ const fr=[...n.parentElement.children].filter(c=>c.tagName===n.tagName); if(fr.length>1) p+=':nth-of-type('+(fr.indexOf(n)+1)+')'; }
    chemin.unshift(p);
  }
  // section = dernier titre placé AVANT l'élément touché, dans le bloc le plus proche qui en contient un
  let section='';
  for(let a=el;a && !section;a=a.parentElement){
    if(a.matches && a.matches('h1,h2,h3,summary,legend')){ section=txt(a.innerText||a.textContent).slice(0,80); break; }
    if(!a.querySelectorAll) continue;
    const avant=[...a.querySelectorAll('h1,h2,h3,summary,legend')].filter(h=>h!==el && (h.compareDocumentPosition(el) & Node.DOCUMENT_POSITION_FOLLOWING || h.contains(el)));
    if(avant.length) section=txt(avant[avant.length-1].innerText||avant[avant.length-1].textContent).slice(0,80);
  }
  const r=el.getBoundingClientRect();
  return { dansHub, balise:el.tagName.toLowerCase(), texte:txt(el.innerText||el.value||el.alt||el.title||el.getAttribute('aria-label')).slice(0,140),
    section, chemin:chemin.join(' > '), position:{x:Math.round((r.left+r.width/2)/win.innerWidth*100), y:Math.round((r.top+r.height/2)/win.innerHeight*100)},
    ecran:win.innerWidth+'×'+win.innerHeight+(win.innerHeight>win.innerWidth?' portrait':' paysage') };
}

    '<label>C\'est…</label><div class="choix">'+[['probleme','🐞 Un problème'],['forme','🎨 Une mise en forme'],['idee','💡 Une idée']].map((t,i)=>'<label><input type="radio" name="sType" value="'+t[0]+'"'+(i===0?' checked':'')+'> '+t[1]+'</label>').join('')+'</div>'+
    '<label>Ton message</label><textarea id="sMsg" placeholder="Ex. : ce tableau déborde en mode portrait"></textarea>',

  if(!v) return;

  const sig={id:'sig-'+Date.now(), cree:new Date().toISOString(), statut:'attente', type:v.type, message:v.message, endroit,
    app: appOuverte?{id:appOuverte.id, nom:appOuverte.nom, version:appOuverte.version}:{id:'hub', nom:'Mon Hub', version:HUB_VERSION, ecran:vueCourante}};

}
const TYPES_SIG={probleme:'🐞 Problème', forme:'🎨 Mise en forme', idee:'💡 Idée'};
function corpsIssue(s){
  const e=s.endroit||{};
  return '**Appli** : '+s.app.nom+' (version '+s.app.version+') — `'+s.app.id+'`'+(s.app.ecran?' — écran « '+s.app.ecran+' »':'')+'\n'+
    '**Type** : '+TYPES_SIG[s.type]+'\n\n**Message** :\n> '+s.message.replace(/\n/g,'\n> ')+'\n\n'+
    (e.aucun?'**Endroit** : aucun endroit précis\n':'**Endroit touché** : '+(e.texte?'« '+e.texte+' »':'élément `'+e.balise+'`')+(e.section?' — section « '+e.section+' »':'')+'\n'+
      '- élément : `'+e.balise+'` — chemin : `'+e.chemin+'`\n- position : '+e.position.x+' % horizontal, '+e.position.y+' % vertical — écran '+e.ecran+'\n')+
    '\n---\nEnvoyé depuis Mon Hub '+HUB_VERSION+' — écrit le '+dateFr(s.cree);

let envoiEnCours=false;
async function envoyerEnAttente(silencieux){
  const bilan={envoyes:0, echecs:0, pasDeCle:false};
  if(envoiEnCours) return bilan; envoiEnCours=true;
  try{
    const reg=await reglageSignal();
    const liste=(await tous('signalements')).filter(s=>s.statut!=='envoye').sort((a,b)=>a.cree.localeCompare(b.cree));
    if(!liste.length) return bilan;
    if(!reg.cle){ bilan.pasDeCle=true; return bilan; }
    for(const s of liste){
      try{
        const r=await fetch('https://api.github.com/repos/'+reg.depot+'/issues',{method:'POST',headers:{'Authorization':'Bearer '+reg.cle,'Accept':'application/vnd.github+json','Content-Type':'application/json'},
          body:JSON.stringify({title:('['+s.app.nom+'] '+TYPES_SIG[s.type].slice(3)+' : '+s.message.replace(/\s+/g,' ')).slice(0,90), body:corpsIssue(s)})});
        if(r.ok){ const j=await r.json(); s.statut='envoye'; s.numero=j.number; s.envoyeLe=new Date().toISOString(); delete s.erreur; bilan.envoyes++; }
        else { s.erreur=r.status===401?'Clé refusée (expirée ou mal copiée)':r.status===404?'Dépôt introuvable, ou la clé n\'y a pas accès':r.status===403?'La clé n\'a pas le droit d\'écrire les signalements (Issues)':'Erreur GitHub '+r.status; bilan.echecs++; }
      }catch(e){ s.erreur='Pas de connexion'; bilan.echecs++; }
      await poser('signalements', s);
      if(s.erreur && s.erreur!=='Pas de connexion') break;
    }
    if(bilan.envoyes && silencieux) toast('✅ '+bilan.envoyes+' signalement(s) en attente envoyé(s)');
  } finally { envoiEnCours=false; if(vueCourante==='sante') afficherCarteSignal(); }
  return bilan;
}
async function testerCle(depot, cle){
  try{
    const r=await fetch('https://api.github.com/repos/'+depot,{headers:{'Authorization':'Bearer '+cle,'Accept':'application/vnd.github+json'}});
    if(r.status===401) return {ok:false, texte:'❌ Clé refusée : elle est expirée ou mal copiée.'};
    if(r.status===404) return {ok:false, texte:'❌ Dépôt « '+depot+' » introuvable, ou la clé n\'y a pas accès.'};
    if(!r.ok) return {ok:false, texte:'❌ Erreur GitHub '+r.status+'.'};
    const j=await r.json();
    return {ok:true, texte:'✅ Connexion OK au dépôt « '+j.full_name+' »'+(j.private?' (privé 🔒).':' — ⚠️ ce dépôt est PUBLIC : tout le monde pourra lire tes signalements.')};
  }catch(e){ return {ok:false, texte:'❌ Pas de connexion internet.'}; }
}

  return (await indexedDB.databases()).filter(b=>b.name && b.name.startsWith(p));
}
async function toutesLesBasesApps(){ if(!indexedDB.databases) return []; return (await indexedDB.databases()).filter(b=>b.name && b.name.startsWith(PREFIXE)); }
async function effacerDonneesApp(id){
  const p=PREFIXE+id+':';
  Object.keys(localStorage).filter(k=>k.startsWith(p)).forEach(k=>localStorage.removeItem(k));
  Object.keys(sessionStorage).filter(k=>k.startsWith(p)).forEach(k=>sessionStorage.removeItem(k));
  for(const b of await basesDeApp(id)) await promReq(indexedDB.deleteDatabase(b.name)).catch(()=>{});
}

/* Encodage des valeurs non-JSON (images, dates…) pour la sauvegarde. */
const b64DeTampon = buf => { let s=''; const o=new Uint8Array(buf); for(let i=0;i<o.length;i+=0x8000) s+=String.fromCharCode.apply(null,o.subarray(i,i+0x8000)); return btoa(s); };
const tamponDeB64 = b => { const s=atob(b), o=new Uint8Array(s.length); for(let i=0;i<s.length;i++) o[i]=s.charCodeAt(i); return o.buffer; };
async function encoder(v){
  if(v===null || typeof v!=='object') return v;
  if(v instanceof Date) return {__hub:'date', v:v.toISOString()};
  if(v instanceof Blob) return {__hub:'blob', type:v.type, nom:v.name||null, b64:b64DeTampon(await v.arrayBuffer())};
  if(v instanceof ArrayBuffer) return {__hub:'ab', b64:b64DeTampon(v)};
  if(ArrayBuffer.isView(v)) return {__hub:'ta', t:v.constructor.name, b64:b64DeTampon(v.buffer.slice(v.byteOffset, v.byteOffset+v.byteLength))};
  if(v instanceof Map) return {__hub:'map', v:await encoder([...v])};
  if(v instanceof Set) return {__hub:'set', v:await encoder([...v])};
  if(Array.isArray(v)){ const a=[]; for(const x of v) a.push(await encoder(x)); return a; }
  const o={}; for(const k of Object.keys(v)) o[k]=await encoder(v[k]); return o;
}
function decoder(v){
  if(v===null || typeof v!=='object') return v;
  if(Array.isArray(v)) return v.map(decoder);
  switch(v.__hub){
    case 'date': return new Date(v.v);
    case 'blob': { const buf=tamponDeB64(v.b64); return v.nom ? new File([buf], v.nom, {type:v.type}) : new Blob([buf],{type:v.type}); }
    case 'ab': return tamponDeB64(v.b64);
    case 'ta': { const C=window[v.t]||Uint8Array; return new C(tamponDeB64(v.b64)); }
    case 'map': return new Map(decoder(v.v));
    case 'set': return new Set(decoder(v.v));
  }
  const o={}; for(const k of Object.keys(v)) o[k]=decoder(v[k]); return o;
}

async function exporterBase(nom){
  const db=await promReq(indexedDB.open(nom));
  const res={nom, version:db.version, magasins:[]};
  for(const s of [...db.objectStoreNames]){
    const t=db.transaction(s), st=t.objectStore(s);
    const mag={nom:s, keyPath:st.keyPath, autoIncrement:st.autoIncrement, index:[...st.indexNames].map(n=>{ const ix=st.index(n); return {nom:n, keyPath:ix.keyPath, unique:ix.unique, multiEntry:ix.multiEntry}; }), lignes:[]};
    const brut=await new Promise((ok,ko)=>{ const l=[]; const c=st.openCursor(); c.onsuccess=()=>{ const cu=c.result; if(cu){ l.push([cu.primaryKey, cu.value]); cu.continue(); } else ok(l); }; c.onerror=()=>ko(c.error); });
    for(const [k,v] of brut) mag.lignes.push({k:await encoder(k), v:await encoder(v)});
    res.magasins.push(mag);
  }
  db.close();
  return res;
}
/* Ajoute dans une base ce qui manque (n'écrase jamais). Renvoie {ajoutes, presents, notes}. */
async function fusionnerBase(dump){
  const bilan={ajoutes:0, presents:0, notes:[]};
  const existe=(await toutesLesBasesApps()).some(b=>b.name===dump.nom);
  let creee=false;
  const req=existe ? indexedDB.open(dump.nom) : indexedDB.open(dump.nom, dump.version||1);
  req.onupgradeneeded=()=>{
    creee=true;
    const db=req.result;
    dump.magasins.forEach(m=>{ if(db.objectStoreNames.contains(m.nom)) return;
      const st=db.createObjectStore(m.nom, m.keyPath==null?{autoIncrement:m.autoIncrement}:{keyPath:m.keyPath, autoIncrement:m.autoIncrement});
      (m.index||[]).forEach(ix=>st.createIndex(ix.nom, ix.keyPath, {unique:ix.unique, multiEntry:ix.multiEntry})); });
  };
  const db=await promReq(req);
  for(const m of dump.magasins){
    if(!db.objectStoreNames.contains(m.nom)){ bilan.notes.push('Partie « '+m.nom+' » absente de la base actuelle : non fusionnée ('+m.lignes.length+' éléments gardés dans le fichier).'); continue; }
    for(const l of m.lignes){
      const k=decoder(l.k), v=decoder(l.v);
      const t=db.transaction(m.nom,'readwrite'), st=t.objectStore(m.nom);
      const n=await promReq(st.count(k));
      if(n){ bilan.presents++; continue; }
      if(st.keyPath==null) st.add(v,k); else st.add(v);
      await new Promise(ok=>{ t.oncomplete=()=>{ bilan.ajoutes++; ok(); }; t.onerror=e=>{ e.preventDefault(); bilan.notes.push('Un élément de « '+m.nom+' » refusé : '+(t.error&&t.error.message)); ok(); }; t.onabort=()=>ok(); });
    }
  }
  db.close();
  if(creee) bilan.notes.push('Base « '+dump.nom.split(':').slice(2).join(':')+' » recréée.');
  return bilan;
}

/* Fusion de deux valeurs texte (localStorage / registre) sans rien perdre. */
function fusionValeurs(actuel, entrant){
  if(actuel===entrant) return {etat:'present'};
  let a,b; try{ a=JSON.parse(actuel); b=JSON.parse(entrant); }catch(e){ return {etat:'conflit'}; }
  const r=fusionObjets(a,b);
  if(r.conflit && !r.ajouts) return {etat:'conflit'};
  if(!r.ajouts) return {etat:'present'};
  return {etat:'fusionne', valeur:JSON.stringify(r.valeur), ajouts:r.ajouts, conflit:r.conflit};
}
function fusionObjets(a,b){
  if(Array.isArray(a) && Array.isArray(b)){
    const res=a.slice(); let ajouts=0;
    const cle = x => (x && typeof x==='object' && !Array.isArray(x)) ? (x.id!=null?'id:'+x.id : (x.cle!=null?'cle:'+x.cle : null)) : null;
    const vus=new Set(a.map(x=>cle(x)||'j:'+JSON.stringify(x)));
    b.forEach(x=>{ const c=cle(x)||'j:'+JSON.stringify(x); if(!vus.has(c)){ res.push(x); vus.add(c); ajouts++; } });
    return {valeur:res, ajouts, conflit:false};
  }
  if(a && b && typeof a==='object' && typeof b==='object' && !Array.isArray(a) && !Array.isArray(b)){
    const res=Object.assign({},a); let ajouts=0, conflit=false;
    Object.keys(b).forEach(k=>{
      if(!(k in a)){ res[k]=b[k]; ajouts++; }
      else if(!egal(a[k],b[k])){ const r=fusionObjets(a[k],b[k]); res[k]=r.valeur; ajouts+=r.ajouts; conflit=conflit||r.conflit; }
    });
    return {valeur:res, ajouts, conflit};
  }
  return {valeur:a, ajouts:0, conflit:!egal(a,b)};
}

/* ---------- Sauvegarde complète ---------- */
async function fabriquerSauvegarde(){
  const apps=await tous('apps');
  const ids=new Set([...apps.map(a=>a.id), ...idsAvecDonnees()]);
  (await toutesLesBasesApps()).forEach(b=>ids.add(b.name.slice(PREFIXE.length).split(':')[0]));
  const donnees={};
  for(const id of ids){
    const p=PREFIXE+id+':', ls={};
    Object.keys(localStorage).filter(k=>k.startsWith(p)).forEach(k=>ls[k.slice(p.length)]=localStorage.getItem(k));
    const bases=[]; for(const b of await basesDeApp(id)) bases.push(await exporterBase(b.name));
    donnees[id]={localStorage:ls, bases};
  }
  return {format:'mon-hub-sauvegarde', version:1, hub:HUB_VERSION, creeeLe:new Date().toISOString(), applis:apps, donnees, registre:await tous('registre')};
}
async function sauvegarder(){
  toast('Préparation de la sauvegarde…');
  const s=await fabriquerSauvegarde();
  enregistrerFichier('MonHub-sauvegarde_'+horodatage()+'.json', JSON.stringify(s), 'application/json');
  await ecrireMeta('derniereSauvegarde', new Date().toISOString());
  if(vueCourante==='sauvegarde') vueSauvegarde();
}
async function lireSauvegarde(){
  const f=await choisirFichier('.json,application/json'); if(!f) return null;
  try{ const j=JSON.parse(await lireTexte(f)); if(j.format!=='mon-hub-sauvegarde') throw 0; return j; }
  catch(e){ await info('Fichier refusé','Ce fichier n\'est pas une sauvegarde de Mon Hub.'); return null; }
}
async function fusionner(s){
  const lignes=[]; const nomApp=id=>{ const a=(s.applis||[]).find(x=>x.id===id); return a?a.nom:id; };
  // 1) Applis (code)
  const actuelles=await tous('apps'); let ordre=actuelles.length;
  for(const a of s.applis||[]){
    const ex=actuelles.find(x=>x.id===a.id);
    if(!ex){ a.ordre=ordre++; await poser('apps',a); lignes.push([a.icone+' '+a.nom,'Appli ajoutée (version '+a.version+')','ok']); }
    else if(ex.code!==a.code) lignes.push([ex.icone+' '+ex.nom,'Code différent dans le fichier : version actuelle '+ex.version+' gardée (fichier : '+a.version+')','att']);
    else lignes.push([ex.icone+' '+ex.nom,'Appli déjà présente, identique','']);
  }
  // 2) Données de chaque appli
  for(const id of Object.keys(s.donnees||{})){
    const d=s.donnees[id], p=PREFIXE+id+':'; let aj=0, pr=0, fu=0, co=0; const notes=[];
    Object.keys(d.localStorage||{}).forEach(k=>{
      const cur=localStorage.getItem(p+k), inc=d.localStorage[k];
      if(cur===null){ localStorage.setItem(p+k,inc); aj++; return; }
      const r=fusionValeurs(cur,inc);
      if(r.etat==='present') pr++; else if(r.etat==='conflit') co++; else { localStorage.setItem(p+k,r.valeur); fu++; if(r.conflit) co++; }
    });
    for(const b of d.bases||[]){ const r=await fusionnerBase(b); aj+=r.ajoutes; pr+=r.presents; notes.push(...r.notes); }
    const txt=[aj&&('+'+aj+' élément(s) ajouté(s)'), fu&&(fu+' liste(s) complétée(s)'), pr&&(pr+' déjà présent(s)'), co&&(co+' différence(s) : valeur actuelle gardée')].filter(Boolean).join(' · ') || 'Rien à ajouter';
    lignes.push(['Données de '+nomApp(id), txt+(notes.length?'<br><small>'+notes.map(esc).join('<br>')+'</small>':''), aj||fu?'ok':(co?'att':'')]);
  }
  // 3) Registre partagé
  let ra=0, rp=0, rc=0;
  for(const e of s.registre||[]){
    const cur=await un('registre',e.cle);
    if(!cur){ await poser('registre',e); ra++; continue; }
    const r=fusionValeurs(JSON.stringify(cur.valeur), JSON.stringify(e.valeur));
    if(r.etat==='present') rp++; else if(r.etat==='conflit') rc++; else { cur.valeur=JSON.parse(r.valeur); await poser('registre',cur); ra++; }
  }
  if((s.registre||[]).length) lignes.push(['Registre partagé', ['+'+ra+' ajouté(s)', rp+' déjà présent(s)', rc?rc+' différence(s) : valeur actuelle gardée':''].filter(Boolean).join(' · '), ra?'ok':'']);
  return lignes;
}
function afficherBilan(titre, lignes, sauvDate){
  return info(titre, '<p class="aide">Sauvegarde du '+dateFr(sauvDate)+'</p><div class="tablo"><table><tr><th>Élément</th><th>Résultat</th></tr>'+
    lignes.map(l=>'<tr><td>'+esc(l[0])+'</td><td class="'+(l[2]||'')+'">'+l[1]+'</td></tr>').join('')+'</table></div>');
}
async function importerFusion(){
  const s=await lireSauvegarde(); if(!s) return;
  toast('Fusion en cours…');
  const lignes=await fusionner(s);
  await afficherBilan('📥 Fusion terminée — rien n\'a été écrasé', lignes, s.creeeLe);
  vueSauvegarde();
}
async function restaurer(){
  const s=await lireSauvegarde(); if(!s) return;
  const c1=await fenetre('♻️ Restaurer : tout remplacer ?','<p class="ko">Toutes les applis et toutes les données actuelles du hub seront remplacées par celles de la sauvegarde du '+esc(dateFr(s.creeeLe))+'.</p><p class="aide">Si tu veux seulement ajouter ce qui manque, utilise plutôt « Importer / fusionner ».</p>',
    [{texte:'Continuer',classe:'rouge',valeur:true},{texte:'Annuler',classe:'gris',valeur:false}]);
  if(!c1) return;
  const c2=await fenetre('Dernière confirmation','<p class="ko">Tout ce qui n\'est pas dans ce fichier sera perdu. Conseil : fais d\'abord une sauvegarde de l\'état actuel.</p>',
    [{texte:'Oui, tout remplacer',classe:'rouge',valeur:true},{texte:'Annuler',classe:'gris',valeur:false}]);
  if(!c2) return;
  toast('Restauration en cours…');
  Object.keys(localStorage).filter(k=>k.startsWith(PREFIXE)).forEach(k=>localStorage.removeItem(k));
  for(const b of await toutesLesBasesApps()) await promReq(indexedDB.deleteDatabase(b.name)).catch(()=>{});
  await vider('apps'); await vider('registre');
  const lignes=await fusionner(s);
  await afficherBilan('♻️ Restauration terminée', lignes, s.creeeLe);
  vueSauvegarde();
}
async function copieDeSecours(){
  let code=null;
  try{ const r=await fetch('index.html'); if(r.ok) code=await r.text(); }catch(e){}
  if(!code) code='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
  enregistrerFichier('MonHub-secours_v'+HUB_VERSION+'.html', code, 'text/html');
}

/* ---------- Écran Sauvegarde ---------- */
function vueSauvegarde(){
  montrer('sauvegarde', async ()=>{
    const derniere=await lireMeta('derniereSauvegarde',null);
    let protege='inconnu', espace='';
    try{ protege = navigator.storage && navigator.storage.persisted ? (await navigator.storage.persisted() ? '<span class="ok">Oui</span>' : '<span class="att">Non</span> <button class="btn petit" id="bProteger">Protéger</button>') : 'inconnu'; }catch(e){}
    try{ if(navigator.storage && navigator.storage.estimate){ const e=await navigator.storage.estimate(); espace=(e.usage/1048576).toFixed(1)+' Mo utilisés'; } }catch(e){}
    const apps=await listeApps(), reg=await tous('registre');
    $('#contenu').innerHTML=
      '<div class="carte"><h2>État</h2><div class="tablo"><table>'+
      '<tr><th>Dernière sauvegarde</th><td>'+(derniere?dateFr(derniere):'<span class="att">jamais</span>')+'</td></tr>'+
      '<tr><th>Données protégées contre l\'effacement automatique</th><td>'+protege+'</td></tr>'+
      '<tr><th>Applis rangées</th><td>'+apps.length+'</td></tr>'+
      '<tr><th>Registre partagé</th><td>'+reg.length+' élément(s)</td></tr>'+
      '<tr><th>Espace</th><td>'+(espace||'—')+'</td></tr>'+
      '<tr><th>Version du hub</th><td>'+HUB_VERSION+'</td></tr></table></div></div>'+
      '<div class="carte"><h2>💾 Sauvegarder</h2><p class="aide">Un seul fichier avec <b>toutes les applis et toutes leurs données</b>. Garde-le aussi sur une carte SD ou une clé USB.</p><button class="btn" id="bSauv">💾 Sauvegarder tout</button></div>'+
      '<div class="carte"><h2>📥 Importer / fusionner</h2><p class="aide">Ajoute ce qui manque, <b>sans jamais rien écraser</b>, puis affiche le détail de ce qui a été ajouté.</p><button class="btn vert" id="bFus">📥 Importer une sauvegarde</button></div>'+
      '<div class="carte"><h2>♻️ Restaurer</h2><p class="aide">Remplace <b>tout</b> le hub par une sauvegarde (double confirmation).</p><button class="btn rouge" id="bRest">♻️ Restaurer</button></div>'+
      '<div class="carte"><h2>🆘 Copie de secours du hub</h2><p class="aide">Le hub lui-même dans un seul fichier HTML. Si tout le reste disparaît : ouvre ce fichier dans Chrome, puis « Importer une sauvegarde ».</p><button class="btn gris" id="bSecours">🆘 Enregistrer la copie de secours</button></div>';
    $('#bSauv').onclick=sauvegarder; $('#bFus').onclick=importerFusion; $('#bRest').onclick=restaurer; $('#bSecours').onclick=copieDeSecours;
    const bp=$('#bProteger'); if(bp) bp.onclick=async()=>{ const ok=await proteger(); toast(ok?'✅ Données protégées':'Chrome n\'a pas encore accordé la protection. Installe le hub sur l\'écran d\'accueil, puis réessaie.',5000); vueSauvegarde(); };
  },'💾 Sauvegarde');
}
async function proteger(){ try{ return navigator.storage && navigator.storage.persist ? await navigator.storage.persist() : false; }catch(e){ return false; } }

/* ---------- Installation sur l'écran d'accueil ---------- */
let invitationInstall=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); invitationInstall=e; if(vueCourante==='accueil') vueAccueil(); });
const estInstalle = () => APP_ANDROID || matchMedia('(display-mode: standalone)').matches || navigator.standalone;
function installAide(){
  if(estInstalle()) return '';
  return '<div class="carte" style="margin-top:16px"><h2>📲 Installer le hub</h2>'+
    (invitationInstall ? '<button class="btn" id="btnInstaller">📲 Installer sur l\'écran d\'accueil</button>'
      : '<p class="aide">Dans Chrome : appuie sur <b>⋮</b> (en haut à droite), puis <b>« Installer l\'application »</b> ou <b>« Ajouter à l\'écran d\'accueil »</b>.</p>')+
    '<p class="aide">Une fois installé, le hub s\'ouvre et marche <b>sans internet</b>.</p></div>';
}
async function installer(){ if(!invitationInstall) return; invitationInstall.prompt(); await invitationInstall.userChoice; invitationInstall=null; proteger(); vueAccueil(); }

/* ---------- Mise à jour du hub lui-même ---------- */
async function verifierVersionHub(){
  try{
    const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'}); if(!r.ok) return;
    const j=await r.json();
    if(String(j.version)!==HUB_VERSION){
      const b=$('#bandeau'); b.style.display='block';
      b.innerHTML='🆕 Nouvelle version du hub disponible ('+esc(j.version)+'). <button class="btn petit" id="bMajHub">Mettre à jour maintenant</button> <span class="aide">Tes applis et tes données ne bougent pas.</span>';
      $('#bMajHub').onclick=majHub;
    }
  }catch(e){}
}
async function majHub(){
  toast('Mise à jour du hub…');
  try{
    const reg=navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if(reg && reg.active){
      await new Promise(ok=>{ const c=new MessageChannel(); c.port1.onmessage=()=>ok(); reg.active.postMessage({type:'rafraichir'},[c.port2]); setTimeout(ok,15000); });
    }
  }catch(e){}
  location.reload();
}

/* ---------- Démarrage ---------- */
(async function demarrer(){
  try{ await ouvrirBase(); }catch(e){ $('#contenu').innerHTML='<div class="carte ko">Impossible d\'ouvrir la mémoire du téléphone : '+esc(e&&e.message)+'</div>'; return; }
  history.replaceState(null,'');
  const appDemandee=new URLSearchParams(location.search).get('app');
  if(appDemandee && await un('apps',appDemandee)){ vueAccueil(); ouvrirApp(appDemandee); }
  else { vueAccueil(); if(appDemandee) toast('Cette appli n\'est plus dans le hub.'); }
  nettoyerJournal().then(afficherControle).catch(()=>{});
  envoyerEnAttente(true);
  window.addEventListener('online',()=>envoyerEnAttente(true));
  if(!APP_ANDROID && 'serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(estInstalle()) proteger();
  document.addEventListener('click', function premierClic(){ proteger(); document.removeEventListener('click', premierClic); }, {once:true});
  if(navigator.onLine !== false){ verifierMisesAJour(); verifierVersionHub(); }
})();

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Journal d'activité</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #f6f7f9; }
  body { margin: 0; font: 17px/1.35 system-ui, Roboto, sans-serif; color: #1b1f23; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: none; border-radius: 12px; cursor: pointer; }
  button:active { transform: scale(.98); }
  .cache { display: none !important; }
  /* barre du haut */
  #haut { flex: 0 0 auto; min-height: 60px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border-bottom: 1px solid #d9dce1; }
  #hTitre { font-size: 19px; font-weight: 900; color: #B5451B; }
  #hSous { font-size: 13px; color: #5b6470; }
  .outils { display: flex; gap: 8px; flex: 0 0 auto; }
  .rond { width: 46px; height: 46px; background: #fff; border: 1px solid #d9dce1; font-size: 20px; }
  #alerte { flex: 0 0 auto; background: #fff6d6; border-bottom: 2px solid #8a5a00; padding: 8px 12px; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  #alerte.rouge { background: #fde8e6; border-color: #a52a1f; }
  /* contenu */
  #vue { flex: 1 1 auto; overflow-y: auto; padding: 10px 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  #pied { flex: 0 0 auto; padding: 8px 12px; background: #f6f7f9; }
  .gros { width: 100%; min-height: 76px; background: #B5451B; color: #fff; font-size: 24px; font-weight: 900; border-radius: 16px; }
  .main { background: #B5451B; color: #fff; font-weight: 700; min-height: 52px; padding: 10px 14px; }
  .sec { background: #fff; border: 1px solid #d9dce1; font-weight: 700; min-height: 52px; padding: 10px 12px; }
  .ligne { display: flex; gap: 6px; flex-wrap: wrap; } .ligne > button { flex: 1 1 0; }
  h2 { font-size: 14px; margin: 8px 0 0; color: #5b6470; text-transform: uppercase; letter-spacing: .4px; }
  p { margin: 0; } .aide { font-size: 14px; color: #5b6470; }
  /* onglets du bas */
  #onglets { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid #d9dce1; }
  #onglets button { background: none; border-radius: 0; border-top: 4px solid #fff; min-height: 64px; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #onglets button b { font-size: 22px; line-height: 1; font-weight: 400; }
  #onglets button[aria-current="page"] { border-top-color: #B5451B; color: #B5451B; font-weight: 900; }
  /* tuiles de l'accueil */
  .tuiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tuile { min-height: 118px; background: #fff; border: 2px solid #d9dce1; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; }
  .tuile .ic { font-size: 40px; line-height: 1; } .tuile .nom { font-size: 20px; font-weight: 700; } .tuile .sous { font-size: 13px; color: #5b6470; }
  .tuile[aria-pressed="true"] { border: 4px solid #B5451B; background: #fdf1ec; } .tuile[aria-pressed="true"] .nom { font-weight: 900; }
  .tuile.plus { border-style: dashed; border-color: #8a929c; background: #f6f7f9; }
  /* tableaux façon Excel */
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; line-height: 1.3; }
  th, td { border: 1px solid #d9dce1; padding: 7px 6px; text-align: left; vertical-align: top; }
  th { background: #e3e6ea; border-color: #c3c8cf; font-size: 12px; font-weight: 700; }
  th button { background: none; border-radius: 0; font-weight: 700; font-size: 12px; padding: 6px 0; width: 100%; text-align: left; min-height: 32px; }
  th[aria-sort] button { color: #B5451B; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td.date { white-space: nowrap; }
  table.histo { font-size: 13.5px; } table.histo th, table.histo td { padding: 7px 5px; } table.histo td.act { white-space: nowrap; }
  tr.ligneH { cursor: pointer; } tr.ligneH.special td { background: #fdf1ec; }
  tr.det td { background: #fafbfc; font-size: 13px; }
  .src { color: #5b6470; } .al { color: #a52a1f; font-weight: 700; } .ok { color: #1f6b43; font-weight: 700; } .att { color: #7a4a00; font-weight: 700; } .gris { color: #5b6470; }
  tr.afaire td { background: #fff6d6; }
  table.milieu td { vertical-align: middle; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #fff; border: 1px solid #d9dce1; border-radius: 22px; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 500; }
  .chip[aria-pressed="true"] { background: #B5451B; border-color: #B5451B; color: #fff; font-weight: 700; }
  .boiteInfo { border: 2px solid #8a5a00; border-radius: 12px; background: #fff6d6; padding: 8px 10px; font-size: 14px; }
  .boiteInfo ul { margin: 4px 0 0; padding-left: 18px; }
  .titreOk { font-size: 19px; font-weight: 900; color: #1f6b43; }
  /* fenêtre par-dessus */
  #voile { position: fixed; inset: 0; background: rgba(27,31,35,.45); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #boite { background: #fff; border-radius: 16px; padding: 16px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow: auto; }
  #boite .t { font-size: 19px; font-weight: 900; }
  #boite input { font: inherit; font-size: 20px; padding: 12px; border: 2px solid #8a929c; border-radius: 12px; width: 100%; user-select: text; -webkit-user-select: text; }
  /* ceinture H10 et séance */
  #haut > div:first-child { min-width: 0; } #hTitre, #hSous { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pilule { height: 46px; padding: 0 10px; background: #fff; border: 1px solid #d9dce1; border-radius: 23px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .pilule.ok { color: #a52a1f; border-color: #a52a1f; } .pilule.ko { background: #fff6d6; border-color: #8a5a00; }
  .grand { background: #fff; border: 1px solid #d9dce1; border-radius: 16px; padding: 10px; text-align: center; }
  .chiffre { font-size: 64px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .trio { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 6px; } .trio > div { border-top: 1px solid #d9dce1; padding-top: 6px; }
  .trio b { display: block; font-size: 32px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; } .trio small { font-size: 13px; color: #5b6470; } .trio .fc b { color: #a52a1f; }
  .fant { border-radius: 14px; padding: 8px 12px; text-align: center; border: 2px solid #c9ced6; background: #fff; } .fant b { display: block; font-size: 38px; font-weight: 900; line-height: 1.15; font-variant-numeric: tabular-nums; } .fant small { font-size: 14px; color: #1b1f23; }
  .fant.av { background: #e8f5ec; border-color: #1f6b43; } .fant.av b { color: #1f6b43; } .fant.re { background: #fdecea; border-color: #a52a1f; } .fant.re b { color: #a52a1f; }
  #bTour { min-height: 92px; font-size: 28px; width: 100%; }
  .fcGros { font-size: 40px; font-weight: 900; color: #a52a1f; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .rouge { background: #a52a1f; color: #fff; font-weight: 900; min-height: 64px; font-size: 19px; padding: 10px 14px; }
  .reglage { background: #fff; border: 1px solid #d9dce1; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
  .reglage .rl { display: flex; align-items: center; justify-content: center; gap: 8px; } .reglage .rl b { font-size: 24px; min-width: 76px; }
  .reglage .rder { font-size: 18px; font-weight: 700; min-height: 24px; }
  .pre { white-space: pre-line; }
  /* exercices à répétitions */
  .petit { min-height: 44px; padding: 6px 12px; } .reglageExo td:first-child { width: 86px; font-weight: 700; } .reglageExo .rl { display: flex; align-items: center; gap: 8px; } .reglageExo .rl b { font-size: 22px; min-width: 70px; text-align: center; }
  .zone { flex: 1 1 auto; min-height: 260px; width: 100%; background: #fff; border: 3px solid #B5451B; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; touch-action: manipulation; }
  .zone:active { transform: none; background: #fdf1ec; }
  .rphase { font-size: 20px; font-weight: 700; text-align: center; } .rgros { font-size: 130px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; } .rsous { font-size: 16px; color: #5b6470; text-align: center; }
  .bandeau { background: #1f6b43; color: #fff; border-radius: 12px; padding: 10px 12px; font-size: 18px; font-weight: 900; text-align: center; }
  #annuler { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 31; background: #1b1f23; color: #fff; border-radius: 12px; padding: 8px 8px 8px 14px; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  #annuler button { flex: 0 0 auto; min-height: 48px; font-size: 17px; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 30; background: #1b1f23; color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<header id="haut">
  <div><div id="hTitre">Journal d'activité</div><div id="hSous"></div></div>
  <div class="outils"><button class="pilule" id="bH10" aria-label="Ceinture H10">❤️ H10</button><button class="rond" id="bAide" aria-label="Aide de cet écran">❓</button><button class="rond" id="bRegl" aria-label="Réglages">⚙️</button></div>
</header>
<div id="alerte" class="cache"></div>
<main id="vue"></main>
<div id="pied" class="cache"><button class="gros" id="bDemarrer">▶ Démarrer</button><button class="rouge cache" id="bArreter" style="width:100%">⏹ Arrêter et enregistrer</button></div>
<nav id="onglets">
  <button data-o="activites"><b>🏠</b>Activités</button>
  <button data-o="historique"><b>📜</b>Historique</button>
  <button data-o="bilans"><b>📊</b>Bilans</button>
  <button data-o="aide"><b>❓</b>Aide</button>
</nav>
<div id="voile" class="cache"><div id="boite" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="cache" role="status"></div>
<div id="annuler" class="cache" role="status"><span id="annulerTxt"></span><button class="main" id="bAnnuler">Annuler</button></div>
<input type="file" id="fichierNav" class="cache" accept=".json,application/json">

<script src="donnees-integrees.js"></script>
<script src="noyau.js"></script>
<script>
"use strict";
/* Journal d'activité (APK) — étape 1 : socle. Écrans : Activités, Historique, Bilans, Aide, Réglages, Descriptif d'import.
   Les données sont dans le téléphone (fichier base.json), écrites par la partie Android. */
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const N = Noyau;

/* ===== Pont vers la partie Android (remplacé par le navigateur quand on teste hors APK) ===== */
const A = (typeof AndroidApp !== "undefined") ? AndroidApp : null;
const Pont = {
  natif: !!A,
  lire(nom) { if (A) return A.lire(nom) || ""; try { return localStorage.getItem("ja:" + nom) || ""; } catch (e) { return ""; } },
  ecrire(nom, txt) { if (A) return !!A.ecrire(nom, txt); try { localStorage.setItem("ja:" + nom, txt); return true; } catch (e) { return false; } },
  version() { try { return A ? A.version() : "essai navigateur"; } catch (e) { return "?"; } },
  async copier(txt) { if (A) return !!A.copier(txt); try { await navigator.clipboard.writeText(txt); return true; } catch (e) { return false; } },
  enregistrer(nom, txt, type) { if (A) return A.enregistrer(nom, txt, type) || ""; try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type })); a.download = nom; a.click(); return nom; } catch (e) { return ""; } },
  partager(nom, txt, type) { if (A) return !!A.partager(nom, txt, type); return false; },
  choisirFichier() { if (A) A.choisirFichier(); else $("#fichierNav").click(); },
  batterieOk() { try { return A ? !!A.batterieOk() : true; } catch (e) { return true; } },
  ouvrirBatterie() { if (A) A.ouvrirBatterie(); },
  notifOk() { try { return A ? !!A.notifOk() : true; } catch (e) { return true; } },
  demanderNotif() { if (A) A.demanderNotif(); },
  sauvegardesAuto() { try { return A ? JSON.parse(A.sauvegardesAuto() || "[]") : []; } catch (e) { return []; } },
  /* ceinture H10 et séance (étape 2) */
  btEtat() { try { return JSON.parse(A.btEtat()); } catch (e) { return { present: !!A, droit: true, allume: true }; } },
  btDemander() { if (A) A.btDemander(); },
  h10Connecter() { try { return A ? !!A.h10Connecter() : false; } catch (e) { return false; } },
  h10Arreter() { try { return A ? !!A.h10Arreter() : true; } catch (e) { return false; } },
  seanceDemarrer(act) { try { return A ? !!A.seanceDemarrer(act) : false; } catch (e) { return false; } },
  seanceArreter() { try { return A ? (A.seanceArreter() || "") : ""; } catch (e) { return ""; } },
  seanceEtat() { try { return JSON.parse(A.seanceEtat()); } catch (e) { return null; } },
  seanceActivite(act) { try { if (A) A.seanceActivite(act); } catch (e) {} },
  impRegler(imp) { try { if (!A) return; if (A.impRegler4) A.impRegler4(imp.seuil, imp.rearme, imp.bip !== false, imp.ecart || 400); else A.impRegler(imp.seuil, imp.rearme, imp.bip !== false); } catch (e) {} },
  essaiDemarrer() { try { return A ? !!A.essaiDemarrer() : false; } catch (e) { return false; } },
  essaiArreter() { try { if (A) A.essaiArreter(); } catch (e) {} },
  essaiDonnees() { try { return JSON.parse(A.essaiDonnees() || "[]"); } catch (e) { return []; } },
  enregistrements() { try { return JSON.parse(A.enregistrements() || "[]"); } catch (e) { return []; } },
  vibrer(ms) { try { if (A) A.vibrer(ms); } catch (e) {} },
  bip(n) { try { if (A) A.bip(n); } catch (e) {} },
  parler(t) { try { if (A) A.parler(t); } catch (e) {} },
  ecranAllume(oui) { oui = !!oui; if (Pont._ecran === oui) return; Pont._ecran = oui; try { if (A) A.ecranAllume(oui); } catch (e) {} },
  brut() { try { return JSON.parse(A.brut() || "[]"); } catch (e) { return []; } },
  /* GPS (étape 4) */
  gpsEtat() { try { return JSON.parse(A.gpsEtat()); } catch (e) { return { droit: !A, toujours: !A, allume: !A }; } },
  gpsDemander() { try { if (A) A.gpsDemander(); } catch (e) {} },
  gpsToujours() { try { if (A) A.gpsToujours(); } catch (e) {} },
  gpsRegler(o) { try { if (A) A.gpsRegler(o.source, o.km); } catch (e) {} },
  seanceDemarrerGps(act) { try { return A ? !!A.seanceDemarrerGps(act) : false; } catch (e) { return false; } },
  seanceTour() { try { return A ? !!A.seanceTour() : false; } catch (e) { return false; } },
  traces() { try { return JSON.parse(A.traces() || "[]"); } catch (e) { return []; } },
  /* fantôme de course : le résumé d'un tracé gardé, recalculé avec le calcul d'aujourd'hui (null si le fichier manque) */
  traceResume(nom) { try { const t = A && A.traceResume ? A.traceResume(nom) : ""; return t ? JSON.parse(t) : null; } catch (e) { return null; } },
  fantomeRegler(r) { try { if (A && A.fantomeRegler) A.fantomeRegler(r); } catch (e) {} },
  partagerBrut(nom) { try { return A ? !!A.partagerBrut(nom) : false; } catch (e) { return false; } }
};

/* ===== Données ===== */
let BASE = N.baseVide(), ecritureKo = false, baseIllisible = false;
function chargerBase() { const lireJson = (nom) => { const t = Pont.lire(nom); if (!t) return { vide: true }; try { const b = JSON.parse(t); return N.baseValide(b) ? { base: N.normaliser(b) } : { ko: t }; } catch (e) { return { ko: t }; } };
  const a = lireJson("base.json"); if (a.base) { BASE = a.base; return; }
  if (a.vide) { const p = lireJson("base.json.prec"); if (p.base) BASE = p.base; return; }
  /* fichier abîmé : on le met de côté (rien n'est effacé) et on reprend la version précédente */
  baseIllisible = true; Pont.ecrire("base-illisible_" + N.horodatage(Date.now()) + ".json", a.ko);
  const p = lireJson("base.json.prec"); if (p.base) BASE = p.base; }
function sauver() { ecritureKo = !Pont.ecrire("base.json", JSON.stringify(BASE)); majAlerte(); return !ecritureKo; }
function regl(cle, defaut) { const v = BASE.reglages[cle]; return v == null ? defaut : v; }
function actCourante() { const vis = N.actsVisibles(BASE), a = regl("act-courante", "pompes"); return vis.includes(a) ? a : (vis[0] || "pompes"); }

/* ===== Petits outils d'écran ===== */
let toastT = null;
function toast(txt, ms) { const t = $("#toast"); t.textContent = txt; t.classList.remove("cache"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("cache"), ms || 3500); }
function fenetre(html) { $("#boite").innerHTML = html; $("#voile").classList.remove("cache"); }
function fermerFenetre() { $("#voile").classList.add("cache"); $("#boite").innerHTML = ""; fenetreH10 = false; }
const fenetreOuverte = () => !$("#voile").classList.contains("cache");
function info(titre, html) { fenetre('<div class="t">' + esc(titre) + '</div><div>' + html + '</div><div class="ligne"><button class="main" data-do="fermer">OK</button></div>'); }
function majAlerte() { const z = $("#alerte"); z.className = ""; z.innerHTML = "";
  if (ecritureKo) { z.classList.add("rouge"); z.innerHTML = "<span>⚠️ Impossible d'écrire dans le téléphone. Tes données affichées ne sont pas enregistrées.</span>"; return; }
  if (baseIllisible) { z.classList.add("rouge"); z.innerHTML = "<span>⚠️ Le fichier de données était abîmé : il est mis de côté, rien n'est effacé. Préviens Claude.</span>"; return; }
  if (!Pont.batterieOk()) { z.innerHTML = '<span>⚠️ Batterie Samsung à régler, sinon l\'appli sera coupée écran éteint.</span><button class="sec" data-do="fiche" data-f="premiere" style="min-height:44px;flex:0 0 auto">Régler</button>'; return; }
  z.classList.add("cache"); }

/* ===== Navigation ===== */
let ECRAN = { nom: "activites" }, PRECEDENT = null;
const ONGLETS = ["activites", "historique", "bilans", "aide"];
function aller(nom, param) { if (ECRAN.nom === "essai" && nom !== "essai") { Pont.essaiArreter(); ESSAI = null; }
  if (!ONGLETS.includes(nom) && ONGLETS.includes(ECRAN.nom)) PRECEDENT = ECRAN; else if (nom === "fiche" && (ECRAN.nom === "seance" || ECRAN.nom === "bilan")) PRECEDENT = ECRAN;   // ❓ pendant une séance : « Retour » y ramène
  ECRAN = { nom, param }; dessiner(); $("#vue").scrollTop = 0; }
function retourEcran() { const p = PRECEDENT || { nom: "activites" }; PRECEDENT = null; ECRAN = p; dessiner(); }
function dessiner() { const e = ECRAN, o = ONGLETS.includes(e.nom) ? e.nom : (e.nom === "fiche" ? "aide" : (PRECEDENT ? PRECEDENT.nom : ""));
  document.querySelectorAll("#onglets button").forEach(b => { if (b.dataset.o === o) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#onglets").classList.toggle("cache", e.nom === "reps"); if (e.nom !== "reps") Pont.ecranAllume(false);
  $("#pied").classList.toggle("cache", e.nom !== "activites" && e.nom !== "seance"); $("#bDemarrer").classList.toggle("cache", e.nom !== "activites"); $("#bArreter").classList.toggle("cache", e.nom !== "seance");
  ({ activites: vueActivites, historique: vueHistorique, bilans: vueBilans, aide: vueAide, fiche: vueFiche, reglages: vueReglages, descriptif: vueDescriptif, seance: vueSeance, bilan: vueBilan, essai: vueEssai, depart: vueDepart, reps: vueReps, bilanReps: vueBilanReps })[e.nom]();
  majAlerte(); }
function titre(t, sous) { $("#hTitre").textContent = t; $("#hSous").textContent = sous || ""; }
/* bouton Retour du téléphone : appelé par la partie Android. Renvoie false quand il n'y a plus rien à fermer. */
window.surRetour = function () { if (fenetreOuverte()) { fermerFenetre(); return true; }
  if (!ONGLETS.includes(ECRAN.nom)) { retourEcran(); return true; }
  if (ECRAN.nom !== "activites") { aller("activites"); return true; } return false; };
/* l'appli revient au premier plan (par ex. après le réglage de batterie) */
window.surReprise = function () { lireEtat(); majH10(); if (ECRAN.nom === "fiche" || ECRAN.nom === "reglages") dessiner(); else majAlerte(); };

/* ===== 🏠 Activités ===== */
function vueActivites() { const lg = N.lignesHistorique(BASE), der = N.derniereParAct(lg), cur = actCourante();
  titre("Journal d'activité", N.jourCourt(Date.now()));
  $("#vue").innerHTML = '<div class="tuiles">' + N.actsVisibles(BASE).map(a => { const i = N.actInfo(a);

  historique: ["Lire l'Historique", "<p>Une ligne = une séance. <b>Touche un titre de colonne</b> pour trier (date, activité, durée, nombre de pompes). Touche encore pour inverser.</p><p><b>Touche une ligne</b> pour voir le détail : chaque note avec son heure et la fréquence cardiaque.</p><p><b>📋 Copier le détail</b> : tout le détail de la séance, à coller dans la conversation avec Claude. Pour un enregistrement de la ceinture : minute par minute (cardio moyen et max, impacts, mouvement) et l'heure exacte de chaque trou. Pour les pompes : série par série.</p><p><b>📤 Tracé GPS</b> et <b>📤 Mesures brutes</b> : envoient le fichier complet de la séance (tous les points du GPS, toutes les mesures de la ceinture), par exemple vers Drive, pour que Claude puisse rejouer la séance.</p><p><b>🗑 Supprimer</b> : un seul appui. Une barre « Annuler » reste 10 secondes en bas de l'écran. Ensuite, la séance reste dans la corbeille (⚙️), d'où tu peux la remettre. Les séances du Carnet et du 30/08/2025 ne se suppriment pas.</p><p>Les boutons du haut filtrent par activité.</p><p><span class='al'>⚠️ trous</span> : moments où l'enregistrement de la ceinture H10 s'est arrêté plus d'une minute.</p><p><span class='src'>(Carnet)</span> et <span class='src'>(montre COROS)</span> : séances venues d'ailleurs que du Journal.</p>"],
  ceinture: ["La ceinture H10", "<p><b>❤️ en haut de l'écran</b> : touche-le pour connecter la ceinture. Porte-la, électrodes mouillées. La première fois, l'appli la cherche ; ensuite elle la retrouve toute seule.</p><p>Connectée, le bouton affiche ta fréquence cardiaque. <b>❤️ …</b> = connexion en cours. <b>❤️ ⚠️</b> = ceinture perdue, l'appli essaie de la retrouver sans s'arrêter.</p><p>C'est un <b>service permanent</b> qui tient la ceinture : il continue écran éteint, téléphone dans le sac. Tant qu'il tourne, une notification reste affichée.</p><p>Sans séance et appli fermée, la ceinture est lâchée au bout de 10 minutes pour économiser sa pile.</p><p>Si une autre appli (Hub, Polar, COROS) tient déjà la ceinture, ferme-la : la H10 n'accepte qu'un téléphone à la fois, sauf réglage spécial.</p>"],
  seance: ["Enregistrer une séance", "<p><b>1.</b> Choisis la tuile (Tennis, Course…), puis « ▶ Démarrer ».</p><p><b>2.</b> L'appli enregistre chaque seconde : fréquence cardiaque, mouvement, impacts. Tu peux <b>éteindre l'écran</b> et ranger le téléphone.</p><p><b>3.</b> À la fin : « ⏹ Arrêter et enregistrer ». Le bilan s'affiche, avec les boutons 📋 Copier.</p><p><b>Rien n'est perdu</b> : chaque seconde est écrite tout de suite dans le téléphone. Si l'appli est fermée par erreur, rouvre-la : l'enregistrement reprend.</p><p><b>Mesures brutes</b> : l'appli garde aussi tout ce que la ceinture envoie (50 mesures par seconde) dans un fichier par séance, environ 2 Mo pour 1 h 30. Le bouton « 📤 Envoyer les mesures brutes » du bilan sert à les donner à Claude pour régler les impacts après coup.</p><p><b>Coupure de ceinture</b> : le signal a sauté ; l'appli a reconnecté toute seule et note la durée. <b>Trou</b> : plus d'une minute sans aucune mesure.</p><p>Pour la course avec le GPS, vois la fiche « Course avec le GPS ».</p>"],
  gps: ["Course avec le GPS", "<p><b>Course, Marche, Vélo</b> : l'appli mesure la distance et l'allure avec le GPS du téléphone, écran éteint, téléphone en poche. La ceinture H10 donne le cardio en plus, mais elle n'est pas obligatoire.</p><p><b>Au départ</b> : touche « ▶ Démarrer », dehors, à ciel ouvert. L'appli cherche les satellites : <b>deux vibrations = GPS prêt</b>, tu peux partir. Le temps de la course compte à partir de ce moment.</p><p><b>🚩 Tour</b> : un appui marque une section à cet endroit (heure, distance, cardio). Le bouton est aussi dans la notification, sur l'écran verrouillé. Dans le bilan, tu retrouves chaque tour : temps, distance, allure.</p><p><b>Km par km</b> : calculé tout seul, toujours. La vibration à chaque kilomètre (deux longues) se coupe dans ⚙️.</p><p><b>La distance</b> est calculée avec les positions du GPS, par petits pas (2 m quand le GPS est propre, plus quand il tremble), et rien n'est compté à l'arrêt. Sur la course de référence du 13/11/2026, ce calcul donne la même distance que la montre. La distance « par la vitesse du GPS » (calcul de la version 1.7, trop court d'environ 3,6 %) reste affichée à côté pour comparer.</p><p><b>Rien n'est perdu</b> : chaque point du GPS est écrit tout de suite dans le téléphone, un par seconde. Si l'appli est fermée par erreur, rouvre-la : la course reprend. Ce tracé complet reste gardé : il servira à couper un bout de parcours ou à créer des sections après coup.</p><p><b>Dans ⚙️, partie GPS</b> : quelles activités utilisent le GPS ; la source (« Satellites seuls » conseillé, ou « Position mélangée ») ; et « Autorisée toujours », conseillé sur Samsung pour que le GPS reparte seul si le téléphone coupe l'appli.</p><p><b>📋 Copier le détail</b> (Historique) : tours, km par km et distance minute par minute, à coller dans la conversation avec Claude pour comparer avec la montre.</p><p>À venir : fantôme vocal, couper le début ou la fin d'un parcours, sections personnalisées.</p>"],
  fantome: ["Courir contre un fantôme", "<p>Le <b>fantôme</b> est une de tes courses passées. Tu recours le même parcours, et l'appli te dit à chaque instant si tu es devant ou derrière lui.</p><p><b>Le choisir</b> : onglet Historique, touche une course faite avec le GPS, puis <b>« 👻 Courir contre cette course »</b>. L'accueil montre alors le fantôme sous les tuiles, et le bouton Démarrer porte un 👻. « Retirer » l'enlève.</p><p><b>Pendant la course</b> : un grand cadre <b>vert</b> (tu es devant) ou <b>rouge</b> (tu es derrière) donne l'écart en mètres et en secondes, et où en est le fantôme. <b>La voix</b> annonce l'écart, écran éteint, aussi dans les écouteurs : « 50 mètres d'avance, 12 secondes ». Le rythme se règle dans ⚙️, partie GPS : tous les 500 m, à chaque km, toutes les minutes, toutes les 2 minutes, ou pas de voix.</p><p><b>Le départ</b> : les deux courses sont comparées à partir du moment où le GPS est prêt (les deux vibrations). Pars du même endroit que la course d'origine.</p><p><b>À la fin</b> : le bilan donne l'écart final et, kilomètre par kilomètre, ton temps, celui du fantôme et l'écart. Tout est aussi dans 📋 Copier le détail.</p><p><b>Bon à savoir</b> : la distance du fantôme est recalculée avec le calcul d'aujourd'hui à partir du tracé complet gardé dans le téléphone. Une course de la version 1.7 affichée « 6,04 km » dans l'Historique donne donc un fantôme de 6,26 km : c'est normal, c'est sa vraie distance.</p><p><b>👻 Pompes et exercices de Muscu</b> : même principe, mais on compte en répétitions. Dans l'Historique, touche une séance (aussi celles du Carnet et la journée du 30/08/2025), puis <b>« 👻 Pompes : faire contre cette séance »</b>. Pendant la séance, un cadre vert ou rouge donne ton avance ou ton retard, la série en cours contre celle du fantôme (« 11 / 15 »), et le <b>repos cible devient celui du fantôme</b> après chaque série. À « ✔ Série finie », la voix dit : « 16. 1 de plus que le fantôme. Au total, 4 d'avance. » Le bilan compare série par série. Tu peux faire plus de séries que lui, ou t'arrêter avant. Pour la Muscu, chaque exercice a son propre fantôme.</p><p>À venir : fantôme préparé à la main (ton programme), écran façon montre, temps cible pour combler l'écart.</p>"],
  impacts: ["Régler les impacts", "<p>Un <b>impact</b> = un coup assez fort senti par la ceinture (frappe de balle, appui). Le <b>seuil</b> dit à partir de quelle force on compte.</p><p><b>Course et Marche : réglage automatique</b> (Course : 1,8 g et 0,25 s au moins entre deux impacts ; Marche : 1,25 g et 0,30 s). Un impact = un pas. Avant la version 1.9, la règle du tennis (0,4 s) refusait un pas sur deux en course. Le réglage utilisé est écrit dans chaque séance. Ce qui suit règle les autres activités (tennis…).</p><p><b>− sensible / + sensible</b> : change le seuil de 0,1 g, même en pleine séance. « Dernier » montre la force du dernier mouvement et s'il a été compté.</p><p><b>🎯 Régler (N coups)</b> : fais par exemple 10 coups à ta force normale, touche « J'ai fini », donne le nombre : l'appli choisit le seuil qui en compte exactement autant.</p><p><b>🔔 Bip</b> : un bip et une vibration à chaque impact compté.</p><p>Chaque réglage est gardé dans un journal : ⚙️ puis « 📋 Rapport des réglages ».</p>"],
  reps: ["Pompes, charge et enchaînement", "<p><b>💪 Pompes</b> : règle l'objectif, la charge et le repos, puis « ▶ Démarrer ». <b>Touche la grande zone à chaque pompe.</b> « ✔ Série finie » lance le repos ; touche de nouveau la zone pour la série suivante.</p><p><b>+1</b> : une pompe faite mais pas prise par l'écran. <b>−1</b> : un appui en trop.</p><p><b>Repos</b> : la zone devient jaune 10 secondes avant la fin, puis verte avec 3 bips et « On reprend ».</p><p><b>Objectif</b> : il peut être dépassé, le compteur ne s'arrête jamais.</p><p><b>⚖️ Charge</b> : sac lesté, barre… Elle peut changer entre deux séries, chaque série garde la sienne.</p><p><b>🏋️ Muscu = enchaînement</b> : compose ta liste d'exercices (pompes, squats, développé couché, biceps barre, ou les tiens). Pendant la séance, « Suivant › » passe à l'exercice suivant et ➕ en ajoute un en route. Toute la séance fait une seule ligne dans l'Historique.</p><p>Si l'appli se ferme, rouvre-la : la séance reprend où elle en était. L'écran reste allumé pendant la séance.</p><p>À venir : fantôme, test TOI / H10, boutons sur l'écran verrouillé.</p>"],
  suite: ["Ce qui arrive ensuite", "<p><b>Étape 2</b> (faite) — Ceinture H10 sans coupure, écran éteint ; enregistrement du tennis.</p><p><b>Étape 3</b> — Pompes : toucher, +1, repos, fantôme, test TOI / H10, boutons sur l'écran verrouillé, voix ; bilans complets.</p><p><b>Étape 4</b> (commencée) — GPS : distance, allure, tours. À venir : fantôme de course vocal, couper un parcours, sections personnalisées.</p><p><b>Étape 5</b> — Activités personnalisables complètes, calibration, import COROS.</p>"]
};

function masquer(a) { const l = N.lireListe(BASE.reglages["acts-masquees"]), i = l.indexOf(a); if (i >= 0) l.splice(i, 1); else { if (N.actsVisibles(BASE).length <= 1) { toast("Garde au moins une activité affichée."); return; } l.push(a); }
  BASE.reglages["acts-masquees"] = JSON.stringify(l); sauver(); vueReglages(); }

  if (b.phase === "repos") { const r = N.repsRepos(REPS, now); gros = N.gm(Math.max(0, r.ecoule));
    if (r.signal === "bientot") { Pont.bip(1); repsSauver(); } else if (r.signal === "reprendre") { Pont.bip(3); Pont.vibrer(400); Pont.parler("On reprend"); repsSauver(); }
    if (r.reste == null) phase = "Repos — série " + (b.series.length + 1) + " ensuite"; else if (r.reste > 0) { phase = (r.fantome ? "Repos du fantôme (" + N.gm(r.cible) + ")" : "Repos") + " — reprise dans " + N.gm(Math.ceil(r.reste)); if (r.reste <= 10) fond = "#fff6d6"; } else { phase = "▶ C'EST LE MOMENT DE REPRENDRE"; fond = "#d6f5e0"; } }
  else if (b.phase === "serie") { gros = b.cur.tl.length; phase = "Série " + (b.series.length + 1); }
  else { gros = 0; phase = "Touche l'écran à chaque " + motRep(b.exo, 1); }
  $("#rGros").textContent = gros; $("#rPhase").textContent = phase; z.style.background = fond;
  $("#rSous").textContent = (b.obj && total >= b.obj ? "✅ " : "") + total + (b.obj ? " / " + b.obj : "") + " " + motRep(b.exo, total) + (b.t0 ? " — " + N.gm(N.repsT(b, now)) : "") + (b.series.length ? " · séries " + b.series.map(x => x.tl.length).join("-") : "");
  const fe = N.fantRepsEtat(b), zf = $("#rFant"); zf.classList.toggle("cache", !fe); if (fe) { zf.classList.toggle("av", fe.ecart > 0); zf.classList.toggle("re", fe.ecart < 0);
    $("#rFantM").textContent = "👻 " + (fe.ecart === 0 ? "à égalité" : N.signe(fe.ecart)) + (b.phase === "serie" && fe.cible != null ? " · série : " + fe.enCours + " / " + fe.cible : "");
    $("#rFantT").textContent = fe.fini ? "le fantôme a fini ses " + fe.series + " séries (" + fe.lui + ") · toi " + fe.moi : "série " + fe.serie + " sur " + fe.series + " : le fantôme en a fait " + fe.cible + " · total " + fe.moi + " contre " + fe.lui; }
  $("#rFc").textContent = fc ? "❤️ " + fc : ""; $("#rDiff").classList.toggle("cache", !b.attendDiff); $("#rBarre").classList.toggle("cache", !!b.attendDiff);
  $("#rCharge").textContent = "⚖️ " + (b.charge ? N.kg(b.charge) : "Sans charge"); const sv = $("#rSuivant"); if (sv) { const nx = REPS.blocs[REPS.index + 1]; sv.textContent = nx ? "Suivant : " + nx.exo + " ›" : "Suivant ›"; } }
function bandeau(txt) { const b = $("#rBandeau"); if (b) { b.textContent = txt; b.classList.remove("cache"); clearTimeout(bandeauT); bandeauT = setTimeout(() => { const x = $("#rBandeau"); if (x) x.classList.add("cache"); }, 5000); } Pont.vibrer(200); Pont.bip(2); Pont.parler(txt.replace(/[^\p{L}\p{N} ,']/gu, "")); }
function repsAppui() { if (!REPS) return; const b = N.repsCourant(REPS), avant = N.repsTotal(b), ev = N.repsAppui(REPS, Date.now(), S.h10.fc || 0); if (N.repsTotal(b) === avant) return; Pont.vibrer(25); repsSauver(); majReps();
  ev.forEach(e => bandeau(e[0] === "record" ? "🏆 Record battu sur une série : " + e[1] : "🎯 " + e[1] + " atteint — continue !")); }
function repsAction(nom, param) { if (!REPS) return; const now = Date.now(), fc = S.h10.fc || 0; let ok = true;
  if (nom === "plus") { ok = N.repsPlus(REPS, now); if (ok) Pont.vibrer(40); } else if (nom === "moins") ok = N.repsMoins(REPS, now);
  else if (nom === "fin") { ok = N.repsFinSerie(REPS, now, fc); if (ok) { const dit = N.fantRepsAnnonce(N.repsCourant(REPS)); Pont.parler(dit ? dit + " Repos." : "Repos"); Pont.vibrer(150); } } else if (nom === "diff") { N.repsDiff(REPS, param); Pont.vibrer(40); }
  if (ok) { repsSauver(); majReps(); } }
function repsChargeOuvrir() { const b = N.repsCourant(REPS), bt = (d, t) => '<button class="sec petit" data-do="repsChargeR" data-d="' + d + '">' + t + '</button>';
  fenetre('<div class="t">⚖️ Charge — ' + esc(b.exo) + '</div><div class="reglage" style="border:none"><div class="rl">' + bt(-1, "−1") + '<b>' + (b.charge ? N.kg(b.charge) : "sans") + '</b>' + bt(1, "+1") + '</div><div class="chips" style="justify-content:center">' + [0, 2, 5, 10, 20].map(x => '<button class="chip" data-do="repsChargeR" data-v="' + x + '" aria-pressed="' + (b.charge === x) + '">' + (x ? x + " kg" : "Sans") + '</button>').join("") + '</div></div><p class="aide">Vaut pour la série en cours si elle n\'a pas commencé, sinon pour la suivante.</p><div class="ligne"><button class="main" data-do="fermer">OK</button></div>'); }
function repsChargeR(b) { const c = N.repsCourant(REPS); N.repsCharge(REPS, b.dataset.v != null ? Number(b.dataset.v) : c.charge + Number(b.dataset.d)); repsSauver(); repsChargeOuvrir(); majReps(); }
function repsSuivant(nom) { if (!REPS) return; fermerFenetre(); if (!nom && REPS.index + 1 >= REPS.blocs.length) { listeExos("repsSuivantExo", "Quel exercice ensuite ?"); return; }
  if (N.repsSuivant(REPS, Date.now(), S.h10.fc || 0, BASE, nom || null)) { repsSauver(); const b = N.repsCourant(REPS); Pont.parler("Exercice suivant : " + b.exo); Pont.vibrer(150); majReps(); } }
function repsArreter() { fenetre('<div class="t">⏹ Terminer la séance ?</div><p>Elle sera rangée dans l\'Historique.</p><div class="ligne"><button class="rouge" data-do="repsFin">Oui, terminer</button></div><div class="ligne"><button class="sec" data-do="fermer">Continuer la séance</button></div>'); }
function repsFin() { fermerFenetre(); const s = repsRanger(); if (REPS) { info("⚠️ Séance non rangée", "<p>Le téléphone a refusé l'écriture. La séance reste en cours, rien n'est perdu. Réessaie.</p>"); return; }
  PRECEDENT = null; if (!s) { toast("Séance vide : rien n'a été enregistré."); aller("activites"); return; } BILANR = N.rapportReps(s, Pont.version()); BILANR.seance = s; aller("bilanReps"); }
function vueBilanReps() { const B = BILANR; if (!B) { aller("historique"); return; } const s = B.seance; titre("✅ Enregistré", N.actInfo(s.act).nom + " · " + N.dateHeure(s.debut));
  $("#vue").innerHTML = '<table><thead><tr><th>Exercice</th><th class="n">Total</th><th>Séries</th><th>Charge</th></tr></thead><tbody>' + s.notes.map(n => { const e = n.reps || n.pompes, nom = n.reps ? n.reps.exo : "Pompes";
      return '<tr><td><b>' + esc(nom) + '</b><br><span class="gris" style="font-size:13px">' + N.gm(e.temps) + (e.reposMoy ? " · repos " + N.gm(e.reposMoy) : "") + '</span></td><td class="n"><b style="font-size:18px">' + e.total + '</b>' + (e.obj ? '<br><span class="' + (e.total >= e.obj ? "ok" : "gris") + '" style="font-size:13px">/ ' + e.obj + '</span>' : "") + '</td><td>' + e.series.join("-") + '</td><td>' + (N.chargeTxt(e, "", "") || "–") + '</td></tr>'; }).join("") + '</tbody></table>' +
    s.notes.map(n => { const e = n.reps || n.pompes, nom = n.reps ? n.reps.exo : "Pompes", f = N.fantRepsBilan(e); if (!f) return ""; const coul = (v) => v > 0 ? '<span class="ok">' + N.signe(v) + '</span>' : v < 0 ? '<span class="al">' + N.signe(v) + '</span>' : "=";
      return '<h2>👻 ' + esc(nom) + ' contre le fantôme</h2><div class="fant ' + (f.ecart > 0 ? "av" : f.ecart < 0 ? "re" : "") + '"><b>' + (f.ecart === 0 ? "à égalité" : N.signe(f.ecart)) + '</b><small>' + esc(f.texte) + '<br>' + esc(f.nom) + '</small></div>' +
        '<table><thead><tr><th>Série</th><th class="n">Moi</th><th class="n">Fantôme</th><th class="n">Écart</th><th class="n">Total</th></tr></thead><tbody>' + f.lignes.map(l => '<tr><td><b>' + l.n + '</b></td><td class="n">' + (l.moi == null ? "–" : l.moi) + '</td><td class="n">' + (l.lui == null ? "–" : l.lui) + '</td><td class="n">' + (l.moi == null || l.lui == null ? "–" : coul(l.moi - l.lui)) + '</td><td class="n"><b>' + coul(l.cumul) + '</b></td></tr>').join("") + '</tbody></table>'; }).join("") +
    '<div class="ligne"><button class="sec" data-do="copierReps">📋 Copier le résumé</button><button class="sec" data-do="copierRepsTout">📋 Copier tout</button><button class="sec" data-do="fichierReps">💾 Fichier</button></div><div class="ligne"><button class="main" data-do="onglet" data-o="historique" style="min-height:60px;font-size:19px">Voir l\'historique</button></div>'; }
setInterval(() => { if (ECRAN.nom === "reps") majReps(); }, 200);

/* ===== 🗑 Supprimer une séance (un appui, puis « Annuler » pendant 10 secondes) et 📋 copier son détail ===== */
let annulerT = null, annulerFn = null;
function barreAnnuler(txt, fn) { $("#toast").classList.add("cache"); $("#annulerTxt").textContent = txt; annulerFn = fn; $("#annuler").classList.remove("cache"); clearTimeout(annulerT); annulerT = setTimeout(fermerAnnuler, 10000); }
function fermerAnnuler() { clearTimeout(annulerT); annulerFn = null; $("#annuler").classList.add("cache"); }
function redessinerListe() { if (ECRAN.nom === "historique") { const y = $("#vue").scrollTop; vueHistorique(); $("#vue").scrollTop = y; } else if (ECRAN.nom === "reglages" || ECRAN.nom === "bilans" || ECRAN.nom === "activites") dessiner(); }
function supprimerSeance(id) { const e = N.supprimerLigne(BASE, id, Date.now()); if (!e) { toast("Cette ligne ne peut pas être supprimée."); return; }
  if (!sauver()) { N.restaurer(BASE, e.t, e.id); redessinerListe(); return; } H.ouverts.delete(id); redessinerListe();
  barreAnnuler("🗑 Supprimée : " + N.actInfo(e.ligne.act).nom + " du " + N.jourCourt(e.ligne.t) + " à " + N.heure(e.ligne.t), () => remettreSeance(e.t, e.id)); }
function remettreSeance(t, id) { if (N.restaurer(BASE, t, id)) { sauver(); toast("✅ Séance remise dans l'Historique."); } redessinerListe(); }

/* ===== Tous les appuis passent par ici (un appui simple, jamais d'appui long) ===== */
const ACTIONS = {
  fermer: fermerFenetre, retour: retourEcran, act: (b) => choisirAct(b.dataset.a), nouvelle: nouvelleAct, creerAct,
  filtre: (b) => { H.filtre = b.dataset.a; vueHistorique(); },
  tri: (b) => { const c = b.dataset.c; if (H.tri === c) H.sens = -H.sens; else { H.tri = c; H.sens = c === "act" ? 1 : -1; } vueHistorique(); },
  ouvrir: (b) => { const id = b.dataset.id; if (H.ouverts.has(id)) H.ouverts.delete(id); else H.ouverts.add(id); const y = $("#vue").scrollTop; vueHistorique(); $("#vue").scrollTop = y; },
  copierHisto: () => copie(N.rapportHistorique(BASE, Pont.version()), "Historique"),
  copierDetail: (b) => { const t = N.detailLigne(BASE, b.dataset.id, Pont.version()); if (t) copie(t, "Détail de la séance"); },
  supprimer: (b) => supprimerSeance(b.dataset.id), remettre: (b) => remettreSeance(Number(b.dataset.t), b.dataset.id),
  fiche: (b) => aller("fiche", b.dataset.f), onglet: (b) => { PRECEDENT = null; aller(b.dataset.o); },
  batterie: () => { if (fenetreOuverte()) fermerFenetre(); Pont.ouvrirBatterie(); }, notif: () => Pont.demanderNotif(), importer: () => Pont.choisirFichier(),
  sauvegarder, partager, fusionAuto: (b) => fusionAuto(b.dataset.n), masquer: (b) => masquer(b.dataset.a),
  copierImport: (b) => { const i = BASE.imports.find(x => String(x.t) === b.dataset.t); if (i) copie(i.resume, "Descriptif"); },
  copierEtat: () => copie(etatAppli(), "État de l'appli"),
  copierResume: () => copie(DESC.resume, "Résumé"), copierTout: () => copie(DESC.tout, "Rapport complet"),
  fichierDesc: () => fichierTexte("JournalActivite-import_" + N.horodatage(DESC.t) + ".txt", DESC.tout),
  h10: ouvrirH10, h10Arreter, btDemander: () => { fermerFenetre(); Pont.btDemander(); }, lancerSeance, sens, bip: basculerBip, changerAct, seanceAct: (b) => seanceAct(b.dataset.a), arreterSeance, finSeance,
  copierBilan: () => copie(BILAN.resume, "Résumé"), copierBilanTout: () => copie(BILAN.tout, "Rapport complet"), fichierBilan: () => fichierTexte("JournalActivite-seance_" + N.horodatage(BILAN.R.debut) + ".txt", BILAN.tout),
  essai: ouvrirEssai, essaiFini, essaiValider, essaiFermer,
  exoR, exoOuvrir: (b) => exoOuvrir(b.dataset.n), fermerRedessiner: () => { fermerFenetre(); dessiner(); }, exoCreer: (b) => exoCreer(b.dataset.action),
  progAjouter: (b) => { if (b.dataset.n) progAjouter(b.dataset.n); else listeExos("progAjouter", "➕ Ajouter un exercice"); }, progMonter: (b) => progModifier(Number(b.dataset.i), true), progOter: (b) => progModifier(Number(b.dataset.i), false),
  repsDemarrer: (b) => repsDemarrer(b.dataset.a), repsPlus: () => repsAction("plus"), repsMoins: () => repsAction("moins"), repsFinSerie: () => repsAction("fin"), repsDiff: (b) => repsAction("diff", Number(b.dataset.d)),
  repsChargeOuvrir, repsChargeR, repsSuivant: () => repsSuivant(null), repsSuivantExo: (b) => repsSuivant(b.dataset.n), repsAjouterExo: () => listeExos("repsSuivantExo", "Passer à quel exercice ?"), repsArreter, repsFin,
  copierReps: () => copie(BILANR.resume, "Résumé"), copierRepsTout: () => copie(BILANR.tout, "Rapport complet"), fichierReps: () => fichierTexte("JournalActivite-seance_" + N.horodatage(BILANR.seance.debut) + ".txt", BILANR.tout),
  partagerBrut: () => { if (!BILAN || !BILAN.brut || !Pont.partagerBrut(BILAN.brut.nom)) toast("⚠️ Envoi impossible."); },
  partagerTrace: (b) => { const nom = b.dataset.n || (BILAN && BILAN.trace && BILAN.trace.nom); if (!nom || !Pont.partagerBrut(nom)) toast("⚠️ Envoi impossible."); },
  fantRepsChoisir, fantRepsRetirer: (b) => { N.fantRepsChoisir(BASE, b.dataset.n, null); sauver(); dessiner(); toast("Fantôme retiré."); },
  fantomeChoisir, fantomeRetirer: (b) => { N.fantChoisir(BASE, b.dataset.a, null); sauver(); vueActivites(); toast("Fantôme retiré."); },
  fantomeRythme: () => { const o = N.fantRythme(BASE); Pont.fantomeRegler(o.rythme); sauver(); vueReglages(); },
  tour: marquerTour, gpsDemander: () => { if (fenetreOuverte()) fermerFenetre(); Pont.gpsDemander(); }, gpsToujours: () => Pont.gpsToujours(),
  lancerSansGps: () => { DEPART.sansGps = true; fermerFenetre(); demarrer(true); }, lancerSansCeinture: () => { DEPART.sansCeinture = true; fermerFenetre(); demarrer(true); },
  gpsAct: (b) => { N.gpsBasculer(BASE, b.dataset.a); sauver(); vueReglages(); }, gpsSource: () => { const o = N.gpsLire(BASE); o.source = o.source === "sat" ? "mix" : "sat"; Pont.gpsRegler(N.gpsEcrire(BASE, o)); sauver(); vueReglages(); },
  gpsKm: () => { const o = N.gpsLire(BASE); o.km = !o.km; Pont.gpsRegler(N.gpsEcrire(BASE, o)); sauver(); vueReglages(); },
  copierReglages: () => copie(N.rapportReglages(BASE), "Rapport des réglages"), copierRecs: () => copie(N.resumeEnregistrements(BASE, Pont.version()), "Résumé des enregistrements")
};
document.addEventListener("click", (e) => { const b = e.target.closest("[data-do]"); if (!b) return; const fn = ACTIONS[b.dataset.do]; if (fn) fn(b); });
document.querySelectorAll("#onglets button").forEach(b => b.onclick = () => { PRECEDENT = null; aller(b.dataset.o); });
$("#bAide").onclick = () => aller("fiche", (ECRAN.nom === "seance" && S.gps && S.gps.f) || (ECRAN.nom === "bilan" && BILAN && BILAN.bilan.fantome) ? "fantome" : (ECRAN.nom === "seance" || ECRAN.nom === "bilan") && (S.gps || (BILAN && BILAN.bilan.gps)) ? "gps" : AIDE_DE[ECRAN.nom] || "premiere");
$("#bRegl").onclick = () => { if (ECRAN.nom === "reglages") retourEcran(); else aller("reglages"); };
$("#bDemarrer").onclick = demarrer;
$("#bH10").onclick = ouvrirH10;
$("#bAnnuler").onclick = () => { const fn = annulerFn; fermerAnnuler(); if (fn) fn(); };
$("#bArreter").onclick = arreterSeance;
$("#voile").addEventListener("click", (e) => { if (e.target.id === "voile" && $("#boite").querySelector("[data-do]")) fermerFenetre(); });
document.addEventListener("keydown", (e) => { if (e.key !== "Enter") return; if (e.target.id === "naNom") creerAct(); else if (e.target.id === "eNb") essaiValider(); else if (e.target.id === "neNom") exoCreer(e.target.dataset.action); });

/* ===== Démarrage ===== */
chargerBase();
lireEtat(); pousserReglage(); importerEnregistrements(); repsCharger();
if (REPS) { PRECEDENT = { nom: "activites" }; aller("reps"); } else if (S.enr) { seanceVue = true; aller("seance"); } else if (!BASE.courses.length && !BASE.imports.length) aller("fiche", "premiere"); else dessiner();
majH10(); setInterval(tic, 1000);
</script>

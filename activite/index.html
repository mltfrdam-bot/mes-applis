<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="color-scheme" content="light">
<title>Journal d'activité</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: #f6f7f9; }
  body { margin: 0; font: 17px/1.35 system-ui, Roboto, sans-serif; color: #1b1f23; display: flex; flex-direction: column; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: none; border-radius: 12px; cursor: pointer; }
  button:active { transform: scale(.98); }
  .cache { display: none !important; }
  /* barre du haut */
  #haut { flex: 0 0 auto; min-height: 60px; padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border-bottom: 1px solid #d9dce1; }
  #hTitre { font-size: 19px; font-weight: 900; color: #B5451B; }
  #hSous { font-size: 13px; color: #5b6470; }
  .outils { display: flex; gap: 8px; flex: 0 0 auto; }
  .rond { width: 46px; height: 46px; background: #fff; border: 1px solid #d9dce1; font-size: 20px; }
  #alerte { flex: 0 0 auto; background: #fff6d6; border-bottom: 2px solid #8a5a00; padding: 8px 12px; font-size: 15px; font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  #alerte.rouge { background: #fde8e6; border-color: #a52a1f; }
  /* contenu */
  #vue { flex: 1 1 auto; overflow-y: auto; padding: 10px 8px 16px; display: flex; flex-direction: column; gap: 10px; }
  #pied { flex: 0 0 auto; padding: 8px 12px; background: #f6f7f9; }
  .gros { width: 100%; min-height: 76px; background: #B5451B; color: #fff; font-size: 24px; font-weight: 900; border-radius: 16px; }
  .main { background: #B5451B; color: #fff; font-weight: 700; min-height: 52px; padding: 10px 14px; }
  .sec { background: #fff; border: 1px solid #d9dce1; font-weight: 700; min-height: 52px; padding: 10px 12px; }
  .ligne { display: flex; gap: 6px; flex-wrap: wrap; } .ligne > button { flex: 1 1 0; }
  h2 { font-size: 14px; margin: 8px 0 0; color: #5b6470; text-transform: uppercase; letter-spacing: .4px; }
  p { margin: 0; } .aide { font-size: 14px; color: #5b6470; }
  /* onglets du bas */
  #onglets { flex: 0 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid #d9dce1; }
  #onglets button { background: none; border-radius: 0; border-top: 4px solid #fff; min-height: 64px; font-size: 13px; font-weight: 500; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  #onglets button b { font-size: 22px; line-height: 1; font-weight: 400; }
  #onglets button[aria-current="page"] { border-top-color: #B5451B; color: #B5451B; font-weight: 900; }
  /* tuiles de l'accueil */
  .tuiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .tuile { min-height: 118px; background: #fff; border: 2px solid #d9dce1; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px 4px; }
  .tuile .ic { font-size: 40px; line-height: 1; } .tuile .nom { font-size: 20px; font-weight: 700; } .tuile .sous { font-size: 13px; color: #5b6470; }
  .tuile[aria-pressed="true"] { border: 4px solid #B5451B; background: #fdf1ec; } .tuile[aria-pressed="true"] .nom { font-weight: 900; }
  .tuile.plus { border-style: dashed; border-color: #8a929c; background: #f6f7f9; }
  /* tableaux façon Excel */
  table { width: 100%; border-collapse: collapse; background: #fff; font-size: 14px; line-height: 1.3; }
  th, td { border: 1px solid #d9dce1; padding: 7px 6px; text-align: left; vertical-align: top; }
  th { background: #e3e6ea; border-color: #c3c8cf; font-size: 12px; font-weight: 700; }
  th button { background: none; border-radius: 0; font-weight: 700; font-size: 12px; padding: 6px 0; width: 100%; text-align: left; min-height: 32px; }
  th[aria-sort] button { color: #B5451B; }
  td.n, th.n { text-align: right; white-space: nowrap; }
  td.date { white-space: nowrap; }
  table.histo { font-size: 13.5px; } table.histo th, table.histo td { padding: 7px 5px; } table.histo td.act { white-space: nowrap; }
  tr.ligneH { cursor: pointer; } tr.ligneH.special td { background: #fdf1ec; }
  tr.det td { background: #fafbfc; font-size: 13px; }
  .src { color: #5b6470; } .al { color: #a52a1f; font-weight: 700; } .ok { color: #1f6b43; font-weight: 700; } .att { color: #7a4a00; font-weight: 700; } .gris { color: #5b6470; }
  tr.afaire td { background: #fff6d6; }
  table.milieu td { vertical-align: middle; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: #fff; border: 1px solid #d9dce1; border-radius: 22px; min-height: 44px; padding: 0 14px; font-size: 15px; font-weight: 500; }
  .chip[aria-pressed="true"] { background: #B5451B; border-color: #B5451B; color: #fff; font-weight: 700; }
  .boiteInfo { border: 2px solid #8a5a00; border-radius: 12px; background: #fff6d6; padding: 8px 10px; font-size: 14px; }
  .boiteInfo ul { margin: 4px 0 0; padding-left: 18px; }
  .titreOk { font-size: 19px; font-weight: 900; color: #1f6b43; }
  /* fenêtre par-dessus */
  #voile { position: fixed; inset: 0; background: rgba(27,31,35,.45); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #boite { background: #fff; border-radius: 16px; padding: 16px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; max-height: 90%; overflow: auto; }
  #boite .t { font-size: 19px; font-weight: 900; }
  #boite input { font: inherit; font-size: 20px; padding: 12px; border: 2px solid #8a929c; border-radius: 12px; width: 100%; user-select: text; -webkit-user-select: text; }
  /* ceinture H10 et séance */
  #haut > div:first-child { min-width: 0; } #hTitre, #hSous { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pilule { height: 46px; padding: 0 10px; background: #fff; border: 1px solid #d9dce1; border-radius: 23px; font-size: 15px; font-weight: 700; white-space: nowrap; }
  .pilule.ok { color: #a52a1f; border-color: #a52a1f; } .pilule.ko { background: #fff6d6; border-color: #8a5a00; }
  .grand { background: #fff; border: 1px solid #d9dce1; border-radius: 16px; padding: 10px; text-align: center; }
  .chiffre { font-size: 64px; font-weight: 900; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .fcGros { font-size: 40px; font-weight: 900; color: #a52a1f; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .rouge { background: #a52a1f; color: #fff; font-weight: 900; min-height: 64px; font-size: 19px; padding: 10px 14px; }
  .reglage { background: #fff; border: 1px solid #d9dce1; border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 6px; text-align: center; }
  .reglage .rl { display: flex; align-items: center; justify-content: center; gap: 8px; } .reglage .rl b { font-size: 24px; min-width: 76px; }
  .reglage .rder { font-size: 18px; font-weight: 700; min-height: 24px; }
  .pre { white-space: pre-line; }
  #toast { position: fixed; left: 12px; right: 12px; bottom: 84px; z-index: 30; background: #1b1f23; color: #fff; border-radius: 12px; padding: 12px 14px; font-size: 15px; font-weight: 600; text-align: center; }
</style>
</head>
<body>
<header id="haut">
  <div><div id="hTitre">Journal d'activité</div><div id="hSous"></div></div>
  <div class="outils"><button class="pilule" id="bH10" aria-label="Ceinture H10">❤️ H10</button><button class="rond" id="bAide" aria-label="Aide de cet écran">❓</button><button class="rond" id="bRegl" aria-label="Réglages">⚙️</button></div>
</header>
<div id="alerte" class="cache"></div>
<main id="vue"></main>
<div id="pied" class="cache"><button class="gros" id="bDemarrer">▶ Démarrer</button><button class="rouge cache" id="bArreter" style="width:100%">⏹ Arrêter et enregistrer</button></div>
<nav id="onglets">
  <button data-o="activites"><b>🏠</b>Activités</button>
  <button data-o="historique"><b>📜</b>Historique</button>
  <button data-o="bilans"><b>📊</b>Bilans</button>
  <button data-o="aide"><b>❓</b>Aide</button>
</nav>
<div id="voile" class="cache"><div id="boite" role="dialog" aria-modal="true"></div></div>
<div id="toast" class="cache" role="status"></div>
<input type="file" id="fichierNav" class="cache" accept=".json,application/json">

<script src="donnees-integrees.js"></script>
<script src="noyau.js"></script>
<script>
"use strict";
/* Journal d'activité (APK) — étape 1 : socle. Écrans : Activités, Historique, Bilans, Aide, Réglages, Descriptif d'import.
   Les données sont dans le téléphone (fichier base.json), écrites par la partie Android. */
const $ = (s) => document.querySelector(s);
const esc = (t) => String(t == null ? "" : t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const N = Noyau;

/* ===== Pont vers la partie Android (remplacé par le navigateur quand on teste hors APK) ===== */
const A = (typeof AndroidApp !== "undefined") ? AndroidApp : null;
const Pont = {
  natif: !!A,
  lire(nom) { if (A) return A.lire(nom) || ""; try { return localStorage.getItem("ja:" + nom) || ""; } catch (e) { return ""; } },
  ecrire(nom, txt) { if (A) return !!A.ecrire(nom, txt); try { localStorage.setItem("ja:" + nom, txt); return true; } catch (e) { return false; } },
  version() { try { return A ? A.version() : "essai navigateur"; } catch (e) { return "?"; } },
  async copier(txt) { if (A) return !!A.copier(txt); try { await navigator.clipboard.writeText(txt); return true; } catch (e) { return false; } },
  enregistrer(nom, txt, type) { if (A) return A.enregistrer(nom, txt, type) || ""; try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], { type })); a.download = nom; a.click(); return nom; } catch (e) { return ""; } },
  partager(nom, txt, type) { if (A) return !!A.partager(nom, txt, type); return false; },
  choisirFichier() { if (A) A.choisirFichier(); else $("#fichierNav").click(); },
  batterieOk() { try { return A ? !!A.batterieOk() : true; } catch (e) { return true; } },
  ouvrirBatterie() { if (A) A.ouvrirBatterie(); },
  notifOk() { try { return A ? !!A.notifOk() : true; } catch (e) { return true; } },
  demanderNotif() { if (A) A.demanderNotif(); },
  sauvegardesAuto() { try { return A ? JSON.parse(A.sauvegardesAuto() || "[]") : []; } catch (e) { return []; } },
  /* ceinture H10 et séance (étape 2) */
  btEtat() { try { return JSON.parse(A.btEtat()); } catch (e) { return { present: !!A, droit: true, allume: true }; } },
  btDemander() { if (A) A.btDemander(); },
  h10Connecter() { try { return A ? !!A.h10Connecter() : false; } catch (e) { return false; } },
  h10Arreter() { try { return A ? !!A.h10Arreter() : true; } catch (e) { return false; } },
  seanceDemarrer(act) { try { return A ? !!A.seanceDemarrer(act) : false; } catch (e) { return false; } },
  seanceArreter() { try { return A ? (A.seanceArreter() || "") : ""; } catch (e) { return ""; } },
  seanceEtat() { try { return JSON.parse(A.seanceEtat()); } catch (e) { return null; } },
  seanceActivite(act) { try { if (A) A.seanceActivite(act); } catch (e) {} },
  impRegler(imp) { try { if (A) A.impRegler(imp.seuil, imp.rearme, imp.bip !== false); } catch (e) {} },
  essaiDemarrer() { try { return A ? !!A.essaiDemarrer() : false; } catch (e) { return false; } },
  essaiArreter() { try { if (A) A.essaiArreter(); } catch (e) {} },
  essaiDonnees() { try { return JSON.parse(A.essaiDonnees() || "[]"); } catch (e) { return []; } },
  enregistrements() { try { return JSON.parse(A.enregistrements() || "[]"); } catch (e) { return []; } },
  vibrer(ms) { try { if (A) A.vibrer(ms); } catch (e) {} },
  brut() { try { return JSON.parse(A.brut() || "[]"); } catch (e) { return []; } },
  partagerBrut(nom) { try { return A ? !!A.partagerBrut(nom) : false; } catch (e) { return false; } }
};

/* ===== Données ===== */
let BASE = N.baseVide(), ecritureKo = false, baseIllisible = false;
function chargerBase() { const lireJson = (nom) => { const t = Pont.lire(nom); if (!t) return { vide: true }; try { const b = JSON.parse(t); return N.baseValide(b) ? { base: N.normaliser(b) } : { ko: t }; } catch (e) { return { ko: t }; } };
  const a = lireJson("base.json"); if (a.base) { BASE = a.base; return; }
  if (a.vide) { const p = lireJson("base.json.prec"); if (p.base) BASE = p.base; return; }
  /* fichier abîmé : on le met de côté (rien n'est effacé) et on reprend la version précédente */
  baseIllisible = true; Pont.ecrire("base-illisible_" + N.horodatage(Date.now()) + ".json", a.ko);
  const p = lireJson("base.json.prec"); if (p.base) BASE = p.base; }
function sauver() { ecritureKo = !Pont.ecrire("base.json", JSON.stringify(BASE)); majAlerte(); return !ecritureKo; }
function regl(cle, defaut) { const v = BASE.reglages[cle]; return v == null ? defaut : v; }
function actCourante() { const vis = N.actsVisibles(BASE), a = regl("act-courante", "pompes"); return vis.includes(a) ? a : (vis[0] || "pompes"); }

/* ===== Petits outils d'écran ===== */
let toastT = null;
function toast(txt, ms) { const t = $("#toast"); t.textContent = txt; t.classList.remove("cache"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add("cache"), ms || 3500); }
function fenetre(html) { $("#boite").innerHTML = html; $("#voile").classList.remove("cache"); }
function fermerFenetre() { $("#voile").classList.add("cache"); $("#boite").innerHTML = ""; fenetreH10 = false; }
const fenetreOuverte = () => !$("#voile").classList.contains("cache");
function info(titre, html) { fenetre('<div class="t">' + esc(titre) + '</div><div>' + html + '</div><div class="ligne"><button class="main" data-do="fermer">OK</button></div>'); }
function majAlerte() { const z = $("#alerte"); z.className = ""; z.innerHTML = "";
  if (ecritureKo) { z.classList.add("rouge"); z.innerHTML = "<span>⚠️ Impossible d'écrire dans le téléphone. Tes données affichées ne sont pas enregistrées.</span>"; return; }
  if (baseIllisible) { z.classList.add("rouge"); z.innerHTML = "<span>⚠️ Le fichier de données était abîmé : il est mis de côté, rien n'est effacé. Préviens Claude.</span>"; return; }
  if (!Pont.batterieOk()) { z.innerHTML = '<span>⚠️ Batterie Samsung à régler, sinon l\'appli sera coupée écran éteint.</span><button class="sec" data-do="fiche" data-f="premiere" style="min-height:44px;flex:0 0 auto">Régler</button>'; return; }
  z.classList.add("cache"); }

/* ===== Navigation ===== */
let ECRAN = { nom: "activites" }, PRECEDENT = null;
const ONGLETS = ["activites", "historique", "bilans", "aide"];
function aller(nom, param) { if (ECRAN.nom === "essai" && nom !== "essai") { Pont.essaiArreter(); ESSAI = null; }
  if (!ONGLETS.includes(nom) && ONGLETS.includes(ECRAN.nom)) PRECEDENT = ECRAN; ECRAN = { nom, param }; dessiner(); $("#vue").scrollTop = 0; }
function retourEcran() { const p = PRECEDENT || { nom: "activites" }; PRECEDENT = null; ECRAN = p; dessiner(); }
function dessiner() { const e = ECRAN, o = ONGLETS.includes(e.nom) ? e.nom : (e.nom === "fiche" ? "aide" : (PRECEDENT ? PRECEDENT.nom : ""));
  document.querySelectorAll("#onglets button").forEach(b => { if (b.dataset.o === o) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#pied").classList.toggle("cache", e.nom !== "activites" && e.nom !== "seance"); $("#bDemarrer").classList.toggle("cache", e.nom !== "activites"); $("#bArreter").classList.toggle("cache", e.nom !== "seance");
  ({ activites: vueActivites, historique: vueHistorique, bilans: vueBilans, aide: vueAide, fiche: vueFiche, reglages: vueReglages, descriptif: vueDescriptif, seance: vueSeance, bilan: vueBilan, essai: vueEssai })[e.nom]();
  majAlerte(); }
function titre(t, sous) { $("#hTitre").textContent = t; $("#hSous").textContent = sous || ""; }
/* bouton Retour du téléphone : appelé par la partie Android. Renvoie false quand il n'y a plus rien à fermer. */
window.surRetour = function () { if (fenetreOuverte()) { fermerFenetre(); return true; }
  if (!ONGLETS.includes(ECRAN.nom)) { retourEcran(); return true; }
  if (ECRAN.nom !== "activites") { aller("activites"); return true; } return false; };
/* l'appli revient au premier plan (par ex. après le réglage de batterie) */
window.surReprise = function () { lireEtat(); majH10(); if (ECRAN.nom === "fiche" || ECRAN.nom === "reglages") dessiner(); else majAlerte(); };

/* ===== 🏠 Activités ===== */
function vueActivites() { const lg = N.lignesHistorique(BASE), der = N.derniereParAct(lg), cur = actCourante();
  titre("Journal d'activité", N.jourCourt(Date.now()));
  $("#vue").innerHTML = '<div class="tuiles">' + N.actsVisibles(BASE).map(a => { const i = N.actInfo(a);
    return '<button class="tuile" data-do="act" data-a="' + esc(a) + '" aria-pressed="' + (a === cur) + '"><span class="ic">' + i.icone + '</span><span class="nom">' + esc(i.nom) + '</span><span class="sous">' + (der[a] ? "dernière : " + N.jourCourt(der[a]) : "aucune séance") + '</span></button>'; }).join("") +
    '<button class="tuile plus" data-do="nouvelle"><span class="ic">➕</span><span class="nom">Nouvelle</span><span class="sous">créer une activité</span></button></div>';
  majDemarrer(); }
function majDemarrer() { $("#bDemarrer").textContent = S.enr ? "● Séance en cours : " + N.actInfo(S.enr.act).nom : "▶ Démarrer " + N.actInfo(actCourante()).nom; }
function choisirAct(a) { BASE.reglages["act-courante"] = a; sauver(); vueActivites(); }
function nouvelleAct() { fenetre('<div class="t">➕ Nouvelle activité</div><label for="naNom">Son nom (ex. Corde à sauter)</label><input id="naNom" maxlength="30" autocomplete="off"><div class="ligne"><button class="main" data-do="creerAct">Créer</button><button class="sec" data-do="fermer">Annuler</button></div>'); setTimeout(() => { const i = $("#naNom"); if (i) i.focus(); }, 50); }
function creerAct() { const nom = ($("#naNom").value || "").trim(); if (!nom) return; const existe = N.toutesActs(BASE).find(a => N.actInfo(a).nom.toLowerCase() === nom.toLowerCase() || a.toLowerCase() === nom.toLowerCase());
  const a = existe || nom; if (!existe) { const p = N.lireListe(BASE.reglages["acts-perso"]); p.push(nom); BASE.reglages["acts-perso"] = JSON.stringify(p); }
  BASE.reglages["acts-masquees"] = JSON.stringify(N.lireListe(BASE.reglages["acts-masquees"]).filter(x => x !== a)); BASE.reglages["act-courante"] = a; sauver(); fermerFenetre(); vueActivites(); }
function demarrer() { const act = actCourante(), a = N.actInfo(act);
  if (S.enr) { aller("seance"); return; }
  if (act === "pompes") { info("▶ Pompes : étape 3", "<p>Le compteur de pompes (toucher, +1, repos, fantôme) arrive à l'étape 3.</p><p style='margin-top:8px'>En attendant, fais ta séance dans le Hub, puis réimporte ta sauvegarde ici : rien n'est mis en double.</p>"); return; }
  if (!Pont.natif) { info("Seulement dans l'APK", "<p>L'enregistrement a besoin de l'appli installée sur le téléphone.</p>"); return; }
  if (!btPret()) return;
  if (!Pont.batterieOk()) { fenetre('<div class="t">⚠️ Batterie Samsung pas réglée</div><p>Sans ce réglage, le téléphone peut couper l\'appli quand l\'écran s\'éteint : l\'enregistrement aurait des trous.</p><div class="ligne"><button class="main" data-do="batterie">Régler maintenant</button></div><div class="ligne"><button class="sec" data-do="lancerSeance">Démarrer quand même</button><button class="sec" data-do="fermer">Annuler</button></div>'); return; }
  lancerSeance(); }

/* ===== 📜 Historique ===== */
const H = { filtre: "", tri: "t", sens: -1, ouverts: new Set() };
const COLS = [["t", "Date"], ["act", "Activité"], ["duree", "Durée"], ["pompes", "Résultat"]];
function vueHistorique() { const tous = N.lignesHistorique(BASE), tt = N.totaux(BASE, tous);
  titre("Historique", N.pl(tt.lignes, "ligne") + " · " + N.nb(tt.pompes) + " pompes");
  const acts = [...new Set(tous.map(x => x.act))]; if (H.filtre && !acts.includes(H.filtre)) H.filtre = "";
  const l = tous.filter(x => !H.filtre || x.act === H.filtre);
  const val = (x) => H.tri === "act" ? N.actInfo(x.act).nom : x[H.tri];
  l.sort((x, y) => { const a = val(x), b = val(y); return (a < b ? -1 : a > b ? 1 : y.t - x.t) * (a === b ? 1 : H.sens); });
  let h = '<div class="chips"><button class="chip" data-do="filtre" data-a="" aria-pressed="' + !H.filtre + '">Tout</button>' + acts.map(a => '<button class="chip" data-do="filtre" data-a="' + esc(a) + '" aria-pressed="' + (H.filtre === a) + '">' + esc(N.actNom(a)) + '</button>').join("") + '</div>';

async function copie(txt, quoi) { toast((await Pont.copier(txt)) ? "✅ " + quoi + " copié : colle-le dans la conversation avec Claude." : "⚠️ Copie refusée par le téléphone : utilise 💾 Fichier.", 4000); }

function sauvegarder() { const ou = Pont.enregistrer(N.nomSauvegarde(), JSON.stringify(N.sauvegarde(BASE, Pont.version())), "application/json"); toast(ou ? "✅ Sauvegarde enregistrée : " + ou : "⚠️ Sauvegarde impossible.", 5000); }
function partager() { if (!Pont.partager(N.nomSauvegarde(), JSON.stringify(N.sauvegarde(BASE, Pont.version())), "application/json")) toast("⚠️ Partage impossible ici : utilise 💾 Sauvegarder.", 4000); }

/* ===== ❤️ Ceinture H10 et séance (étape 2) =====

let S = ETAT_VIDE, seanceVue = false, arretEnCours = false, demarrageT = 0, fenetreH10 = false, BILAN = null, ESSAI = null;
function lireEtat() { const s = Pont.seanceEtat(); S = s && s.h10 ? Object.assign({}, ETAT_VIDE, s) : ETAT_VIDE; }
function majH10() { const b = $("#bH10"), e = S.h10.etat; let t = "❤️ H10", c = "";
  if (e === H10.CONNECTE) { t = "❤️ " + (S.h10.fc || "…"); c = " ok"; } else if (e === H10.PERDUE || e === H10.BT_ETEINT || e === H10.SANS_DROIT) { t = "❤️ ⚠️"; c = " ko"; } else if (e !== H10.ARRET) t = "❤️ …";

function btPret() { const b = Pont.btEtat();

  if (!b.allume) { fenetre('<div class="t">Bluetooth éteint</div><p>Allume le Bluetooth pour connecter la ceinture.</p><div class="ligne"><button class="main" data-do="btDemander">Allumer</button><button class="sec" data-do="fermer">Plus tard</button></div>'); return false; }
  return true; }
function pousserReglage() { Pont.impRegler(N.impLire(BASE)); }
/* bouton ❤️ du haut : connecte la ceinture, ou montre son état */

  fenetreH10 = true; fenetre('<div class="t">❤️ Ceinture H10</div><table class="milieu"><tbody><tr><td>État</td><td id="fhEtat"></td></tr><tr><td>Ceinture</td><td id="fhNom"></td></tr><tr><td>Fréquence cardiaque</td><td id="fhFc" style="font-weight:900;font-size:20px"></td></tr></tbody></table>' +
    (S.enr ? '<p class="aide">Une séance est en cours : la ceinture reste connectée.</p>' : '<div class="ligne"><button class="sec" data-do="essai">🎯 Régler les impacts</button><button class="sec" data-do="h10Arreter">Déconnecter</button></div>') + '<div class="ligne"><button class="main" data-do="fermer">OK</button></div>'); fenetreH10 = true; majFenetreH10(); }
function majFenetreH10() { if (!$("#fhEtat")) return; $("#fhEtat").innerHTML = S.h10.etat === H10.CONNECTE ? '<span class="ok">✅ connectée</span>' : '<span class="att">' + esc(S.service ? S.h10.texte : "arrêtée") + '</span>'; $("#fhNom").textContent = S.h10.nom || "–"; $("#fhFc").textContent = S.h10.fc ? "❤️ " + S.h10.fc : "–"; }
function h10Arreter() { fermerFenetre(); if (!Pont.h10Arreter()) toast("Une séance est en cours : la ceinture reste connectée."); setTimeout(tic, 500); }

/* une fois par seconde */
function tic() { lireEtat(); majH10();
  if (S.enr && !seanceVue) { seanceVue = true; if (ECRAN.nom !== "seance" && ECRAN.nom !== "essai") aller("seance"); }
  if (!S.enr && seanceVue && !arretEnCours && Date.now() - demarrageT > 6000) { seanceVue = false; const n = importerEnregistrements(); if (ECRAN.nom === "seance") { if (demarrageT && !n) info("⚠️ L'enregistrement n'a pas démarré", "<p>Le service n'a pas pu se lancer. Vérifie l'autorisation Bluetooth, puis réessaie.</p>"); aller(n ? "historique" : "activites"); } demarrageT = 0; }
  if (ECRAN.nom === "seance") majSeance(); else if (ECRAN.nom === "essai") majEssai(); else if (ECRAN.nom === "activites") majDemarrer();
  if (fenetreH10) majFenetreH10(); }

/* ----- séance ----- */
function lancerSeance() { fermerFenetre(); const act = actCourante(); pousserReglage();
  if (!Pont.seanceDemarrer(act)) { info("⚠️ Démarrage impossible", "<p>Le service d'enregistrement n'a pas pu démarrer. Vérifie l'autorisation Bluetooth.</p>"); return; }
  seanceVue = true; demarrageT = Date.now(); aller("seance"); setTimeout(tic, 500); }
function htmlReglage(ctx) { return '<div class="reglage"><div class="rl"><button class="sec" data-do="sens" data-d="100" data-c="' + ctx + '">− sensible</button><b id="rSeuil"></b><button class="sec" data-do="sens" data-d="-100" data-c="' + ctx + '">+ sensible</button></div><div id="rDer" class="rder"></div><div class="ligne"><button class="sec" data-do="bip" id="rBip"></button></div></div>'; }
function majReglage() { if (!$("#rSeuil")) return; const i = N.impLire(BASE), d = S.dernier; $("#rSeuil").textContent = N.gg(i.seuil) + " g"; $("#rBip").textContent = i.bip ? "🔔 Bip à chaque impact : oui" : "🔕 Bip à chaque impact : non";
  $("#rDer").innerHTML = d ? "Dernier : " + N.gg(d.m) + " g " + (d.m > i.seuil ? '<span class="ok">✅ compté</span>' : '<span class="al">✗ pas compté</span>') : ""; }
function vueSeance() { const act = S.enr ? S.enr.act : actCourante(); titre("● " + N.actInfo(act).nom, "enregistrement en cours");
  $("#vue").innerHTML = '<div class="grand"><div class="chiffre" id="sTemps">0:00</div><div class="fcGros" id="sFc">❤️ –</div></div><div class="boiteInfo cache" id="sAlerte"></div>' +
    '<table class="milieu"><tbody><tr><td>⚡ Impacts</td><td class="n" id="sImp" style="font-weight:900;font-size:20px">0</td></tr><tr><td>Temps actif</td><td class="n" id="sActif"></td></tr><tr><td>FC moyenne / max</td><td class="n" id="sFcm"></td></tr><tr><td>Enregistré</td><td class="n" id="sEnr"></td></tr>' +
    '<tr><td>Ceinture</td><td class="n" id="sLien" style="white-space:normal"></td></tr><tr><td>Capteur de mouvement</td><td class="n" id="sAcc" style="white-space:normal"></td></tr><tr><td>Coupures de ceinture</td><td class="n" id="sDeco"></td></tr></tbody></table>' + htmlReglage("enreg") +
    '<p class="aide">Tu peux éteindre l\'écran et ranger le téléphone : l\'enregistrement continue.' + (act === "footing" ? " Course : le GPS arrive à l'étape 4, pour l'instant FC et mouvement." : "") + '</p>' +
    '<div class="ligne"><button class="sec" data-do="changerAct">✎ Activité</button><button class="sec" data-do="essai">🎯 Régler (N coups)</button></div>';
  majSeance(); }
function majSeance() { const e = S.enr; if (!e || !$("#sTemps")) { majReglage(); return; } const a = S.acc || ETAT_VIDE.acc, ok = S.h10.etat === H10.CONNECTE;
  if ($("#hTitre").textContent !== "● " + N.actInfo(e.act).nom) titre("● " + N.actInfo(e.act).nom, "enregistrement en cours");
  $("#sTemps").textContent = N.chrono(e.ecoule); $("#sFc").textContent = "❤️ " + (S.h10.fc || "–"); $("#sImp").textContent = e.pics; $("#sActif").textContent = N.hm(e.actif); $("#sFcm").textContent = (e.fcMoy || "–") + " / " + (e.fcMax || "–");
  $("#sEnr").innerHTML = N.hm(e.duree) + (e.perdu > 5 ? ' <span class="al">(perdu ' + N.dureeCourte(e.perdu) + ')</span>' : "");
  $("#sLien").innerHTML = ok ? '<span class="ok">✅ connectée</span>' : '<span class="al">' + esc(S.h10.texte) + '</span>';
  $("#sAcc").innerHTML = !ok ? "–" : !a.present ? '<span class="att">⚠️ non accessible</span>' : a.erreur ? '<span class="att">⚠️ ' + esc(a.erreur) + '</span>' : !a.actif ? "en attente…" : a.taux ? '<span class="ok">✅ ' + a.taux + ' mesures/s</span>' : '<span class="att">⚠️ aucune mesure reçue</span>';
  $("#sDeco").textContent = e.deconnexions + (e.coupures ? " · " + N.pl(e.coupures, "reprise") : "");
  const al = $("#sAlerte"), msg = e.journalKo ? "⚠️ Le téléphone refuse d'écrire : arrête la séance pour ne rien perdre." : !ok && S.h10.depuis > 3 && e.ecoule > 5 ? esc(S.h10.texte) + " depuis " + N.dureeCourte(S.h10.depuis) + ". L'appli réessaie sans s'arrêter." : "";
  al.classList.toggle("cache", !msg); al.innerHTML = msg; majReglage(); }
function sens(b) { const imp = N.impRegler(BASE, Number(b.dataset.d), b.dataset.c, S.dernier ? S.dernier.m : null); sauver(); Pont.impRegler(imp); Pont.vibrer(20); majReglage(); if (ECRAN.nom === "essai") majEssai(); }
function basculerBip() { const imp = N.impBip(BASE, !N.impLire(BASE).bip); sauver(); Pont.impRegler(imp); majReglage(); }
function changerAct() { fenetre('<div class="t">✎ Activité de cette séance</div>' + N.actsVisibles(BASE).filter(a => a !== "pompes").map(a => '<div class="ligne"><button class="sec" data-do="seanceAct" data-a="' + esc(a) + '">' + esc(N.actNom(a)) + '</button></div>').join("") + '<div class="ligne"><button class="sec" data-do="fermer">Annuler</button></div>'); }
function seanceAct(a) { fermerFenetre(); Pont.seanceActivite(a); BASE.reglages["act-courante"] = a; sauver(); setTimeout(tic, 300); }
function arreterSeance() { fenetre('<div class="t">⏹ Arrêter l\'enregistrement ?</div><p>La séance sera rangée dans l\'Historique.</p><div class="ligne"><button class="rouge" data-do="finSeance">Oui, arrêter</button></div><div class="ligne"><button class="sec" data-do="fermer">Continuer la séance</button></div>'); }
function lireEnregistrement(nom) { try { return JSON.parse(Pont.lire("enregistrements/" + nom)); } catch (e) { return null; } }
/* ajoute à l'Historique les enregistrements terminés qui n'y sont pas encore (par ex. séance finie pendant que l'écran était fermé) */
function importerEnregistrements() { let n = 0; N.enregistrementsManquants(BASE, Pont.enregistrements()).forEach(nom => { const R = lireEnregistrement(nom); try { if (R && N.ajouterEnregistrement(BASE, R)) n++; } catch (e) {} }); if (n) sauver(); return n; }
function finSeance() { fermerFenetre(); arretEnCours = true; const nom = Pont.seanceArreter();
  if (!nom) { arretEnCours = false; info("⚠️ Séance non terminée", "<p>Le téléphone a refusé d'écrire le fichier. L'enregistrement continue, rien n'est perdu. Réessaie dans un instant.</p>"); return; }
  importerEnregistrements(); const R = lireEnregistrement(nom); arretEnCours = false; seanceVue = false; demarrageT = 0; lireEtat(); majH10();
  if (!R) { aller("historique"); return; } BILAN = N.rapportEnregistrement(R, N.impLire(BASE), Pont.version()); BILAN.R = R;
  BILAN.brut = Pont.brut().find(x => x.nom === "brut-" + R.debut + ".bin") || null; if (BILAN.brut) { const l = "\nMesures brutes : " + BILAN.brut.nom + " (" + mo(BILAN.brut.taille) + ")"; BILAN.resume += l; BILAN.tout += l; } aller("bilan"); }
const mo = (octets) => octets >= 1e6 ? (octets / 1e6).toFixed(1).replace(".", ",") + " Mo" : Math.max(1, Math.round(octets / 1024)) + " Ko";
function vueBilan() { const B = BILAN; if (!B) { aller("historique"); return; } const b = B.bilan, R = B.R, propre = !b.trous.length && b.perdu <= 10;

  $("#vue").innerHTML = '<div class="boiteInfo" style="' + (propre ? "background:#e8f5ec;border-color:#1f6b43" : "") + '"><b>' + (propre ? "✅ Aucun trou : l'enregistrement est complet." : "⚠️ Il manque " + N.dureeCourte(b.perdu) + " dans cet enregistrement.") + '</b></div>' +
    '<table><tbody>' + L.map(r => '<tr><td>' + esc(r[0]) + '</td><td class="n"><b>' + esc(r[1]) + '</b></td></tr>').join("") + '</tbody></table>' +

/* ----- 🎯 réglage « N coups » ----- */
function ouvrirEssai() { fermerFenetre(); lireEtat();
  if (!Pont.natif) { info("Seulement dans l'APK", "<p>Le réglage se fait avec la ceinture, dans l'appli installée sur le téléphone.</p>"); return; }
  if (!S.service) { if (!btPret()) return; pousserReglage(); if (!Pont.h10Connecter()) { toast("⚠️ Impossible de démarrer la ceinture."); return; } }

  if (ESSAI.etape === "resultat") { $("#vue").innerHTML = '<div class="boiteInfo pre" style="font-size:16px">' + esc(ESSAI.texte) + '</div>' + htmlReglage(ESSAI.ctx) + '<div class="ligne"><button class="sec" data-do="essai">Refaire un essai</button><button class="main" data-do="essaiFermer">Terminé</button></div>'; majReglage(); return; }
  $("#vue").innerHTML = '<div class="boiteInfo" style="font-size:16px">Fais tes coups (par exemple 10), à ta force normale, puis touche « J\'ai fini ».</div><div class="grand"><div id="eVal" style="font-size:28px;font-weight:900">…</div><div id="eInfo" class="aide"></div><div id="eDer" style="font-size:16px;font-weight:700;line-height:1.7;margin-top:6px"></div></div>' + htmlReglage(ESSAI.ctx) +

function majEssai() { if (!ESSAI || ESSAI.etape !== "coups" || !$("#eVal")) { majReglage(); return; }

  copierReglages: () => copie(N.rapportReglages(BASE), "Rapport des réglages"), copierRecs: () => copie(N.resumeEnregistrements(BASE, Pont.version()), "Résumé des enregistrements")

document.addEventListener("click", (e) => { const b = e.target.closest("[data-do]"); if (!b) return; const fn = ACTIONS[b.dataset.do]; if (fn) fn(b); });
document.querySelectorAll("#onglets button").forEach(b => b.onclick = () => { PRECEDENT = null; aller(b.dataset.o); });
$("#bAide").onclick = () => aller("fiche", AIDE_DE[ECRAN.nom] || "premiere");
$("#bRegl").onclick = () => { if (ECRAN.nom === "reglages") retourEcran(); else aller("reglages"); };
$("#bDemarrer").onclick = demarrer;
$("#bH10").onclick = ouvrirH10;
$("#bArreter").onclick = arreterSeance;
$("#voile").addEventListener("click", (e) => { if (e.target.id === "voile" && $("#boite").querySelector("[data-do]")) fermerFenetre(); });
document.addEventListener("keydown", (e) => { if (e.key !== "Enter") return; if (e.target.id === "naNom") creerAct(); else if (e.target.id === "eNb") essaiValider(); });

/* ===== Démarrage ===== */
chargerBase();
pousserReglage(); lireEtat(); importerEnregistrements();
if (S.enr) { seanceVue = true; aller("seance"); } else if (!BASE.courses.length && !BASE.imports.length) aller("fiche", "premiere"); else dessiner();
majH10(); setInterval(tic, 1000);
</script>

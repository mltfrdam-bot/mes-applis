# Fabrique l'appli « Lecteur » (musique et vidéo) et la met en téléchargement dans « Releases ».
# Se lance toute seule à chaque modification du dossier lecteur/, ou à la main (onglet Actions).
name: Fabrication APK Lecteur

on:
  push:
    branches: [main]
    paths: ["lecteur/**", ".github/workflows/lecteur.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lecteur:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Fabriquer et signer
        working-directory: lecteur/android
        env:
          CLE_FICHIER: ${{ github.workspace }}/signature/mes-applis.keystore
          CLE_MOT_DE_PASSE: ${{ secrets.CLE_MOT_DE_PASSE }}
        run: |
          if [ -z "$CLE_MOT_DE_PASSE" ]; then
            gradle --no-daemon assembleDebug -PnumVersion=${{ github.run_number }}
            echo "::error::Fabrication d'essai réussie, mais le secret CLE_MOT_DE_PASSE manque : APK non signé, non publié."; exit 1
          fi
          gradle --no-daemon assembleRelease -PnumVersion=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk ../../Lecteur.apk
          ls -l ../../Lecteur.apk
      - name: Mettre en téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lecteur
          name: "Lecteur musique et vidéo — dernière version"
          body: |
            **Lecteur.apk** : à ouvrir sur le téléphone pour installer ou mettre à jour l'appli (tes playlists, favoris et écoutes sont gardés). Version de fabrication n° ${{ github.run_number }}.
          files: Lecteur.apk
          make_latest: false
